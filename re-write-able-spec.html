<div class="rwa-doc-sub">A specification for self-modifying HTML documents</div>

<section class="rwa-doc-section" id="s1">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">1.</span><span class="rwa-doc-sec-title">The Name</span></div>
<div class="rwa-doc-body">
<p><strong>re</strong> — it does it again. The agent loop, self-modification, iteration over time.<br><strong>write</strong> — not read. Not consume. Author. The read/write web, finally delivered.<br><strong>able</strong> — a property of the file itself. Not a permission the OS grants you. Something it <em>is</em>.</p>
<p><code>re-write-able</code> is both a description and a manifesto. A re-writeable file is one that participates in its own creation.</p>
</div>
</section>

<section class="rwa-doc-section" id="s2">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">2.</span><span class="rwa-doc-sec-title">The Problem</span></div>
<div class="rwa-doc-body">
<p>The web became read-only for most people.</p>
<p>You consume apps. Someone else made them, deployed them, owns them. You have no access to the source. You can't change them. You certainly can't ask them to change themselves.</p>
<p>Office suites used to ship documents — <code>.doc</code>, <code>.xls</code>, <code>.ppt</code>. Files you owned, on disk, sharable by email. They moved to the cloud and you stopped owning the document.</p>
<p>The tools that do let you modify things — code editors, CLIs, build pipelines — require you to already be a developer. Citizen development tools (no-code, low-code) give you drag-and-drop but hide the source and lock you to a platform.</p>
<p>There is no middle ground: a document that is fully sourceful, fully ownable, fully modifiable, but requires no environment, no install, no server, no account.</p>
<p>A re-writeable file is that middle ground.</p>
</div>
</section>

<section class="rwa-doc-section" id="s3">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">3.</span><span class="rwa-doc-sec-title">The Concept</span></div>
<div class="rwa-doc-body">
<p>A re-writeable file is a single <code>.html</code> file that:</p>
<ol>
<li><strong>Renders itself</strong> — open it in any browser, it runs</li>
<li><strong>Stores itself</strong> — its working state lives in IndexedDB; the file itself is the durable record</li>
<li><strong>Modifies itself</strong> — an embedded agent rewrites the document on instruction</li>
<li><strong>Commits itself</strong> — the current state is written back into the file, in place when the browser supports it, as a download otherwise</li>
<li><strong>Requires nothing</strong> — no server, no install, no build step, no account</li>
</ol>
<p>The user-authored content is a <strong>document</strong> — sometimes pure prose, sometimes a tracker, sometimes a spreadsheet, often all three at once. Interactivity is a property a document may or may not have, not a definition. Word, Excel, and PowerPoint each picked one mode and made the others awkward; HTML can do all three in the same file. <code>re-write-able</code> returns the document to the form factor that made office suites work in the first place: a file you own, on disk, that you can send.</p>
<p>The runtime is software. The document is the artifact.</p>
</div>
</section>

<section class="rwa-doc-section" id="s4">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">4.</span><span class="rwa-doc-sec-title">The Read/Write Web</span></div>
<div class="rwa-doc-body">
<p>Tim Berners-Lee's original vision was a read/write web. The browser was meant to be an editor. The web became predominantly read-only — a distribution medium, not a creation medium.</p>
<p><code>re-write-able</code> is a correction at the file level:</p>
<table>
<thead><tr><th>Web as it is</th><th>re-write-able</th></tr></thead>
<tbody>
<tr><td>You consume apps</td><td>You own the document</td></tr>
<tr><td>Documents live in the cloud</td><td>Documents live in a file</td></tr>
<tr><td>The format is proprietary</td><td>The format is HTML</td></tr>
<tr><td>Changing requires a developer</td><td>Changing requires a sentence</td></tr>
<tr><td>Deployment is a process</td><td>Deployment is sharing a file</td></tr>
<tr><td>Open source is a repository</td><td>Open source is the file itself</td></tr>
</tbody>
</table>
<p>HTML can do everything Word, Excel, and PowerPoint did — and it can do all three in the same document. <code>re-write-able</code> makes the document writable again, on disk, by the person who owns it.</p>
</div>
</section>

<section class="rwa-doc-section" id="s5">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">5.</span><span class="rwa-doc-sec-title">Architecture</span></div>
<div class="rwa-doc-body">

<h3>5.1 Container, Bootstrap, and Document</h3>
<p>Three terms anchor the rest of the spec:</p>
<ul>
<li><strong>Container</strong> — the <code>.html</code> file as a whole. The thing you open, share, attach to email, drop on a desktop.</li>
<li><strong>Bootstrap</strong> — the immutable shell inside the container: a loader, a runtime, and an inline snapshot of the document. The bootstrap is byte-identical across every open until a commit, and a commit only rewrites the snapshot — the loader and runtime bytes do not change.</li>
<li><strong>Document</strong> — the user-authored part: HTML, CSS, optional JS, and structured data. Mutable. Lives in IndexedDB at runtime; lives as a frozen snapshot inside the bootstrap at rest.</li>
</ul>
<pre><code>container (the .html file on disk)
└── bootstrap (immutable shell — never modified except by commit)
    ├── loader        (hydrate IndexedDB on first open, render the document on every open)
    ├── runtime       (⌘K, ⌘Z, ⌘S, agent wrapper, status UI, storage API)
    └── const INLINE_DOC = \`…\`   (frozen snapshot — first-open seed and commit target)</code></pre>
<p>The bootstrap is to a re-writeable file what <code>gate.py</code> is to a governed self-modification system: the one thing the agent cannot touch. The agent receives only the document; the bootstrap, loader, runtime, and inline snapshot are not visible to it. There is no "preserve this script block verbatim" instruction — the runtime is structurally inaccessible, not contractually protected.</p>

<h3>5.2 The Bootstrap</h3>
<p>The bootstrap holds three responsibilities.</p>
<p><strong>Loader.</strong> On every open, hydrates IndexedDB from the inline snapshot if IndexedDB is empty, then renders the document. The first-open path and every-other-open path are the same code path; the only difference is whether IndexedDB starts empty.</p>
<p><strong>Runtime.</strong> Provides the self-modification surface and a small API for the document:</p>
<ul>
<li><code>⌘K</code> — modification prompt</li>
<li><code>⌘Z</code> — undo (pop from the IDB undo stack, up to 10 levels)</li>
<li><code>⌘S</code> — commit (write the bootstrap back to disk with an updated inline snapshot, in place when possible)</li>
<li>Storage adapters: <code>runtime.db.*</code> (IndexedDB), <code>runtime.fs.*</code> (OPFS)</li>
<li>Agent invocation: <code>runtime.modify(instruction)</code></li>
<li>Status UI: storage health, FSA permission status, dirty/clean indicator, commit nudge</li>
</ul>
<p>The full runtime API surface is in §7.</p>
<p><strong>Inline snapshot.</strong> A JavaScript template literal containing a serialized payload — the rendered HTML/CSS/JS plus the contents of all IndexedDB stores and OPFS paths the document uses. The snapshot is the source of truth on first open; IndexedDB takes over after hydration; on commit, IndexedDB and OPFS are serialized back into the snapshot. One snapshot, one round-trip, one source of truth at any given moment.</p>

<h3>5.3 Storage Model</h3>
<p>Four tiers, each chosen for what it does best.</p>
<table>
<thead><tr><th>Tier</th><th>Holds</th><th>Sync?</th><th>Mutated when</th></tr></thead>
<tbody>
<tr><td><strong>IndexedDB</strong></td><td><code>rwa_doc</code>, <code>rwa_undo</code>, <code>rwa_hist</code>, plus document-defined stores</td><td>Async</td><td>Every ⌘K, ⌘Z, and document write</td></tr>
<tr><td><strong>OPFS</strong></td><td>Binary blobs — images, attachments, large or streamable content</td><td>Async</td><td>Document-driven</td></tr>
<tr><td><strong>sessionStorage</strong></td><td>OpenRouter API key</td><td>Sync</td><td>On submit; cleared on tab close</td></tr>
<tr><td><strong>Filesystem</strong></td><td>The container itself (bootstrap with current inline snapshot)</td><td>n/a</td><td>On commit (⌘S)</td></tr>
</tbody>
</table>
<p>LocalStorage is not part of the architecture. Everything that previously lived there moves to IndexedDB. The benefit: one tier for all working state, larger quota, no split between source storage and data storage.</p>
<h4>Reserved namespaces</h4>
<p>The runtime owns these — generated documents must not touch them.</p>
<ul>
<li>IndexedDB stores: <code>rwa_doc</code>, <code>rwa_undo</code>, <code>rwa_hist</code>, and any future store named <code>rwa_*</code>.</li>
<li>OPFS paths: anything under <code>_rwa/</code>.</li>
</ul>

<h3>5.4 The Rewrite Loop</h3>
<pre><code>user presses ⌘K, types instruction
  → runtime reads rwa_doc from IndexedDB
  → agent call: system prompt + document + instruction
                (no bootstrap, no runtime, no inline snapshot in the prompt)
  → push prior rwa_doc onto rwa_undo (cap 10)
  → write returned document to rwa_doc
  → loader re-renders</code></pre>
<p>The agent receives only the document. The bootstrap, loader, runtime, and inline snapshot are not in the prompt, and the agent cannot modify them because they are not visible. This eliminates the prior architecture's "preserve the runtime block verbatim" instruction — a fragile contract that depended on the model not drifting on the most repetition-prone part of the prompt.</p>
<p>A side benefit: the prompt is smaller. The runtime overhead (~10–15 KB) is no longer charged on every modification, and smaller, cheaper models become viable defaults.</p>
<p><code>⌘Z</code> pops <code>rwa_undo</code> and writes it to <code>rwa_doc</code>. Multiple undos walk back through history. Together, <code>rwa_undo</code> and <code>rwa_hist</code> form a dialogue log: what the user asked and what the document became at each step. Undo isn't just version control — it's conversation replay.</p>

<h3>5.5 First Open and Hydration</h3>
<pre><code>open container.html
  → bootstrap runs
  → loader checks IndexedDB for rwa_doc
  → empty? hydrate: copy INLINE_DOC into rwa_doc, replay any data stores it carries
  → render document
  → runtime attaches event listeners</code></pre>
<p>There is no build form, no description prompt, no agent call on first open. The file is a document the moment it is opened. If you want a particular initial state, ship the file with that state baked into the inline snapshot. If you want a blank slate, ship a snapshot of a blank slate.</p>

<h3>5.6 Commit and Export</h3>
<p><code>⌘S</code> has one semantics — <em>commit</em> — and two implementations depending on browser capability.</p>
<p><strong>Chromium with a persisted FSA handle (commit-in-place):</strong></p>
<pre><code>serialize current rwa_doc + all document-defined IDB stores + relevant OPFS contents
  → rewrite the INLINE_DOC constant inside the bootstrap
  → handle.createWritable() → write whole .html → close
  → status: clean</code></pre>
<p><strong>All others (export-as-new-file):</strong></p>
<pre><code>same serialization
  → trigger download of new .html with updated INLINE_DOC
  → user manually attaches/saves
  → status: clean since last export</code></pre>
<p>Other than the destination, the two implementations are byte-identical: the same bootstrap, the same updated inline snapshot, the same self-contained file.</p>
<p><strong>Undo state stays local.</strong> <code>rwa_undo</code> and <code>rwa_hist</code> are not serialized into the inline snapshot. A committed file is a clean state, not a state plus its history. A recipient of a shared file starts with a fresh undo stack.</p>

<h3>5.7 The Null Origin Bus</h3>
<p>Under <code>file://</code>, all re-writeable files share the same origin: <code>null</code>. They share IndexedDB and OPFS namespaces. This is by design — it is the local communication bus.</p>
<pre><code>budget.html      → writes  IDB store budget_data
tracker.html     → writes  IDB store tracker_data
dashboard.html   → reads   budget_data + tracker_data
                 → renders a unified view across both documents</code></pre>
<p>IndexedDB does not fire <code>storage</code> events. Use <code>BroadcastChannel</code> for cross-document pub/sub. Served over HTTP/HTTPS, each file gets a real origin and the bus breaks. The bus is a local-distribution feature.</p>

<h3>5.8 Embedding and Composition</h3>
<p>A re-writeable can embed another re-writeable inline via <code>iframe.srcdoc</code>. <code>&lt;iframe src="file://…"&gt;</code> is blocked by Chrome and Firefox; <code>srcdoc</code> avoids that. The <code>sandbox</code> attribute controls capability: <code>""</code> for snapshot, <code>"allow-scripts"</code> for live view, <code>"allow-scripts allow-same-origin"</code> for full embed.</p>

</div>
</section>

<section class="rwa-doc-section" id="s6">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">6.</span><span class="rwa-doc-sec-title">The Agent Contract</span></div>
<div class="rwa-doc-body">

<h3>6.1 Modify</h3>
<p>There is no separate "build" path. Every modification — including the first one — goes through the same loop: the agent receives the current document and returns a modified document.</p>
<p>The agent's mental model is <strong>document, not application</strong>. The opening of the system prompt frames it that way:</p>
<blockquote>You are modifying a document. The document may be prose, it may be a tracker, it may be a spreadsheet, it may be all three. Read what is there. Apply the user's instruction to the actual content — its tone if it is prose, its structure if it is data, its behavior if it is interactive.</blockquote>
<p>A document-first prompt produces different default behavior from an app-first prompt: less reflexive interactivity, more attention to prose tone and visual structure when those are what the user is editing. A user editing a press release does not want the agent to add a button bar; a user editing a budget tracker does not want the agent to pad the rows with filler prose.</p>
<p>Concrete rules supplied to the agent:</p>
<ul>
<li>Return the complete modified document only — no commentary, no markdown fence</li>
<li>All CSS inline; JS inline only when the document has interactivity. Prose documents may be JS-free.</li>
<li>No React, no build steps, no npm</li>
<li>Use <code>runtime.db.*</code> for structured data, <code>runtime.fs.*</code> for blobs</li>
<li>Dark theme palette by default (§8); honor explicit visual instructions over the default</li>
<li>The first character of the response should begin the modified content directly</li>
</ul>
<p>The agent receives only the document as context. The bootstrap, loader, runtime, inline snapshot, and undo stack are not visible.</p>

<h3>6.2 Model choice</h3>
<p><code>google/gemini-3-flash-preview</code> via OpenRouter is the default — fast, cheap, and a context window that comfortably holds any reasonable single-file document plus instructions. For complex structural modifications, <code>anthropic/claude-sonnet-4</code> produces more reliable results at higher cost. The model is configurable per file via the runtime's settings.</p>

</div>
</section>

<section class="rwa-doc-section" id="s7">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">7.</span><span class="rwa-doc-sec-title">Runtime API</span></div>
<div class="rwa-doc-body">
<p>The document interacts with the runtime through a small surface exposed on the global <code>runtime</code> object.</p>
<pre><code>runtime.db = {
  get(store, key),
  put(store, key, value),
  del(store, key),
  all(store),                       // iterate
  open(store, { autoIncrement }),   // declare document store (rejects rwa_*)
  subscribe(store, callback),       // BroadcastChannel-backed
};

runtime.fs = {
  read(path),                       // returns Blob
  write(path, blob),
  del(path),
  list(prefix),                     // rejects _rwa/
};

runtime.modify(instruction);        // ⌘K programmatic equivalent
runtime.commit();                   // ⌘S programmatic equivalent
runtime.undo();                     // ⌘Z programmatic equivalent

runtime.status = {                  // observable
  dirty: boolean,                   // unexported changes?
  fsa: 'granted' | 'prompt' | 'denied' | 'unsupported' | 'lost',
  storage: { usage, quota },
};</code></pre>
<p>The document is free to use IndexedDB and OPFS directly without going through the runtime, but the API does the bookkeeping (cross-tab sync, status tracking, reserved-name protection).</p>
<p>A pure-prose document may not call this API at all. The runtime is still loaded — ⌘K, ⌘Z, ⌘S still work — but the document itself can be a single <code>&lt;article&gt;</code> and a stylesheet.</p>
</div>
</section>

<section class="rwa-doc-section" id="s8">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">8.</span><span class="rwa-doc-sec-title">Design Rules for Documents</span></div>
<div class="rwa-doc-body">
<h3>Structure</h3>
<ul>
<li>Single self-contained document; CSS inline; JS inline only when the document has interactivity</li>
<li>No React, no build steps, no npm</li>
<li>Libraries from <code>cdnjs.cloudflare.com</code> only when the document genuinely needs them</li>
<li>Fonts from Google Fonts (DM Sans, DM Mono, Instrument Serif) — for true offline operation, the agent may inline them as base64</li>
</ul>
<h3>Visual</h3>
<ul>
<li>Dark theme: <code>#0e0e0f</code> background, <code>#161618</code> surface, <code>#2d2d34</code> border</li>
<li>Text: <code>#dddde4</code> primary, <code>#575766</code> muted</li>
<li>Accent: <code>#b8ff57</code> (green), <code>#57c8ff</code> (blue), <code>#ff5757</code> (red)</li>
<li>Fonts: DM Sans (UI), DM Mono (labels/code), Instrument Serif (display)</li>
</ul>
<h3>Data</h3>
<ul>
<li>Structured data in IndexedDB via <code>runtime.db.*</code> (when the document has structured data)</li>
<li>Binary blobs in OPFS via <code>runtime.fs.*</code> (when the document has blobs)</li>
<li>Pure-prose documents need neither tier</li>
<li>Never use store names starting with <code>rwa_</code> (reserved)</li>
<li>Never write to <code>_rwa/</code> paths in OPFS (reserved)</li>
</ul>
<h3>Quality</h3>
<ul>
<li>Production-quality: polished, usable, complete</li>
<li>For prose: well-typed, real representative copy — never lorem ipsum</li>
<li>For data: real representative records — never lorem ipsum</li>
<li>For interactive: keyboard shortcuts where appropriate</li>
</ul>
</div>
</section>

<section class="rwa-doc-section" id="s9">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">9.</span><span class="rwa-doc-sec-title">Platform Behavior</span></div>
<div class="rwa-doc-body">
<table>
<thead><tr><th>Platform</th><th>IndexedDB</th><th>OPFS</th><th>FSA write-in-place</th><th>Eviction risk</th></tr></thead>
<tbody>
<tr><td>Chrome (desktop)</td><td>Up to ≈60% of free disk</td><td>Yes</td><td>Yes (with permission)</td><td>Low</td></tr>
<tr><td>Chrome (Android)</td><td>≈6–10% of free disk</td><td>Yes</td><td>No</td><td>Medium</td></tr>
<tr><td>Firefox (desktop)</td><td>≈2 GB per origin</td><td>Yes</td><td>No</td><td>Low</td></tr>
<tr><td>Safari (macOS)</td><td>≈1 GB per origin</td><td>Yes</td><td>No</td><td>Low</td></tr>
<tr><td>Safari (iOS)</td><td>≈50 MB</td><td>Yes</td><td>No</td><td><strong>High</strong></td></tr>
<tr><td>iOS PWA</td><td>Up to ≈1 GB</td><td>Yes</td><td>No</td><td>Medium</td></tr>
</tbody>
</table>
<h3>9.1 The iOS Safari Problem</h3>
<p>WebKit on iOS actively evicts site data — IndexedDB and OPFS — when the device is low on storage or after a period of inactivity. Private mode provides near-zero quota.</p>
<p>The committed file is the only durable artifact. The runtime's commit nudge is especially important on mobile. <code>navigator.storage.persist()</code> is requested on boot — Chrome Android honors it, Safari ignores it. Private/incognito mode is unsupported.</p>
<h3>9.2 The Null Origin and Shared Quotas</h3>
<p>Under <code>file://</code>, all re-writeable files share the same origin and therefore the same storage quota. The bus benefits from this; the shared quota is a constraint.</p>
</div>
</section>

<section class="rwa-doc-section" id="s10">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">10.</span><span class="rwa-doc-sec-title">Security and Permissions</span></div>
<div class="rwa-doc-body">
<p><strong>API key</strong>: stored in <code>sessionStorage</code> only. Survives reload, cleared on tab close. Never written to the file, never in IndexedDB, never leaves the browser except in the Authorization header.</p>
<p><strong>Self-modification</strong>: rendering the document from IndexedDB is essentially <code>eval</code> at document scope. For a personal local tool this is the correct tradeoff. The risk surface is mitigated by the <code>file://</code> origin model (no cross-origin writes).</p>
<p><strong>The bootstrap is the anchor</strong>: it is never in IndexedDB and never modified by the agent. If something goes wrong, reload the file — the inline snapshot is the last known good state, and the runtime can be reset by clearing IndexedDB.</p>

<h3>10.1 FSA Permission Lifecycle</h3>
<table>
<thead><tr><th>State</th><th>Trigger</th><th>Behavior</th></tr></thead>
<tbody>
<tr><td><code>unsupported</code></td><td>Browser is not Chromium</td><td>Commit always exports; ⌘S triggers a download</td></tr>
<tr><td><code>prompt</code></td><td>First commit on a new session</td><td>Browser prompts; on grant, persist handle to IDB</td></tr>
<tr><td><code>granted</code></td><td>Handle is persisted and verified</td><td>Commit-in-place; no further prompts unless revoked</td></tr>
<tr><td><code>denied</code></td><td>User denied or revoked</td><td>Fall back to download mode</td></tr>
<tr><td><code>lost</code></td><td>Handle exists but is no longer valid</td><td>Show "reattach to file" affordance</td></tr>
</tbody>
</table>

<h3>10.2 Storage Exhaustion</h3>
<p>Quota errors during write must not corrupt <code>rwa_doc</code>. On <code>QuotaExceededError</code>: restore <code>rwa_doc</code> from <code>rwa_undo</code> top, show error, preserve undo and history. If headroom is still needed, the runtime sheds the oldest undo entry first.</p>

<h3>10.3 Multi-Tab Concurrency</h3>
<p>Two tabs writing to IndexedDB: last write wins, undo stacks diverge. Two tabs committing via FSA: file corruption is possible. The runtime acquires a soft lock via <code>BroadcastChannel</code> on first modification or commit; other tabs detect the lock and open in read-only mode with a "take over" affordance.</p>
</div>
</section>

<section class="rwa-doc-section" id="s11">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">11.</span><span class="rwa-doc-sec-title">Open Questions</span></div>
<div class="rwa-doc-body">
<p>Intentional open issues — load-bearing design decisions still being weighed.</p>
<h3>11.1 Rendering Isolation</h3>
<p>Three options for rendering the document into the bootstrap page: <strong>innerHTML</strong> (simplest, CSS/JS can collide), <strong>iframe srcdoc</strong> (full isolation, postMessage required), <strong>shadow DOM for runtime UI, light DOM for the document</strong> (UI isolated, scripts not). Current direction: <em>innerHTML for the document, runtime UI in plain DOM scoped under <code>#rwa-runtime</code></em>.</p>
<h3>11.2 First-Render Strategy</h3>
<p>IndexedDB load is async. Three strategies: <strong>blank</strong>, <strong>splash</strong>, or <strong>synchronous from inline snapshot, reconcile after</strong>. Current direction: synchronous from inline snapshot.</p>
<h3>11.3 Diff Protocol Reintroduction</h3>
<p>For documents over ~200 KB, full-content rewrites get slow and expensive. A SEARCH/REPLACE diff protocol may return as an automatic upgrade above a size threshold.</p>
<h3>11.4 ⌘S Semantics</h3>
<p>⌘S means "commit" regardless of destination — write-in-place when possible, download otherwise. Current direction: unified key.</p>
</div>
</section>

<section class="rwa-doc-section" id="s12">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">12.</span><span class="rwa-doc-sec-title">Citizen Development Model</span></div>
<div class="rwa-doc-body">
<p>re-write-able is designed for the person who:</p>
<ul>
<li>Has ideas for documents and tools but cannot (or does not want to) write code</li>
<li>Is suspicious of cloud platforms and wants to own their files</li>
<li>Understands HTML at a surface level — enough to know it's "just a file"</li>
<li>Would share a spreadsheet but not deploy an app</li>
</ul>
<p>The mental model is: <em>it's like a Word document, but the document can rewrite itself.</em></p>
<p>The deployment model is: <em>drag it to your desktop. Done.</em></p>
<p>The collaboration model is: <em>send the file. They have everything.</em></p>
</div>
</section>

<section class="rwa-doc-section" id="s13">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">13.</span><span class="rwa-doc-sec-title">Webinar Demo Flow</span></div>
<div class="rwa-doc-body">
<h3>"The file that builds itself"</h3>
<p><strong>Act 1 — The container</strong> (2 min). Open <code>tracker.html</code> in Chrome — the document is just there, no build screen. Open <code>letter.html</code> next to it — same architecture, different content type. Show the bootstrap in the source: loader, runtime, <code>INLINE_DOC</code> constant.</p>
<p><strong>Act 2 — Self-modification</strong> (5 min). On the tracker: ⌘K, "add a priority field". On the letter: ⌘K, "tighten the second paragraph and pull the bullet list into a callout". Same loop, different content type, prose-aware response.</p>
<p><strong>Act 3 — Undo</strong> (1 min). ⌘Z walks history backward. The file has memory.</p>
<p><strong>Act 4 — Commit</strong> (2 min). ⌘S — on Chromium, the file rewrites itself in place; elsewhere, a new download. The diff in the file: only <code>INLINE_DOC</code> changed.</p>
<p><strong>Act 5 — The bus</strong> (2 min). A dashboard reads from both. IndexedDB shows all three documents' stores under the null origin. The web was supposed to be read/write.</p>
</div>
</section>

<section class="rwa-doc-section" id="s14">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">14.</span><span class="rwa-doc-sec-title">What This Is Not</span></div>
<div class="rwa-doc-body">
<ul>
<li><strong>Not a no-code platform</strong> — there is no platform. The file is the platform.</li>
<li><strong>Not a cloud app</strong> — nothing is on a server. IndexedDB is the database.</li>
<li><strong>Not just for apps</strong> — a re-writeable file can be a press release, a tax return, a wedding invitation, a budget. Interactivity is a property a document may have, not a definition of one.</li>
<li><strong>Not an AI coding assistant</strong> — the agent doesn't help you write code. It edits the document.</li>
<li><strong>Not a CMS</strong> — there is no content management layer. The document is the content.</li>
<li><strong>Not a framework</strong> — there is nothing to install, nothing to configure, nothing to update.</li>
</ul>
<p>It is a file that writes itself.</p>
</div>
</section>

<section class="rwa-doc-section" id="s15">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">15.</span><span class="rwa-doc-sec-title">Prior Art and Influences</span></div>
<div class="rwa-doc-body">
<p><strong>Clive</strong> (ikangai/clive) — the direct intellectual ancestor. Clive gives an LLM a terminal to inhabit; re-write-able gives it a browser tab. The bootstrap plays the role of <code>gate.py</code>.</p>
<p><strong>Simon Willison's HTML tools</strong> — 150+ single-file HTML applications demonstrating that the format is serious, durable, and production-worthy.</p>
<p><strong>The read/write web</strong> (Berners-Lee, 1999) — the browser was meant to be an editor.</p>
<p><strong>HyperCard</strong> (Atkinson, 1987) — a stack was a program you could read and modify. re-write-able is HyperCard for the agent era.</p>
<p><strong>Word, Excel, PowerPoint</strong> (1980s–) — the office suite proved that a document is something you own, on disk, that you can send. Then the documents moved to the cloud. re-write-able returns the document to a file.</p>
</div>
</section>

<section class="rwa-doc-section" id="sinv">
<div class="rwa-doc-sec-head"><span class="rwa-doc-sec-num">∎</span><span class="rwa-doc-sec-title">Invariants</span></div>
<div class="rwa-doc-body">
<p>Load-bearing properties — every change to the runtime, bootstrap, or storage model should preserve them.</p>
<ol>
<li>The bootstrap is byte-identical across every open until commit, and a commit only rewrites the <code>INLINE_DOC</code> constant — the loader and runtime bytes do not change.</li>
<li>The runtime is always loaded from the bootstrap, never from IndexedDB. The agent has no access to it.</li>
<li>Reserved IndexedDB stores (<code>rwa_*</code>) and OPFS paths (<code>_rwa/</code>) are written only by the runtime.</li>
<li>Every committed file is self-contained — opens and runs without external dependencies.</li>
<li>The inline snapshot is the source of truth on first open. After hydration, IndexedDB is the source of truth until the next commit.</li>
<li>Undo history lives in IndexedDB, not in the file. Commits do not carry undo state.</li>
</ol>
</div>
</section>

// ─── Constants ──────────────────────────────────────────────────────
const RWA = {
  DB: 'rwa_' + DOC_UUID,
  STORE_DOC: 'rwa_doc',
  STORE_UNDO: 'rwa_undo',
  STORE_HIST: 'rwa_hist',
  STORE_FSA: 'rwa_fsa',
  KEY: 'self',
  UNDO_CAP: 10,
  HIST_CAP: 15,
  KEY_API: 'rwa_apikey',
  KEY_MODEL: 'rwa_model',
  DEFAULT_MODEL: 'google/gemini-3-flash-preview',
  TITLE: 're-write-able',
  FILENAME: 're-write-able-spec.html',
};

// ─── IndexedDB helpers ──────────────────────────────────────────────
let _db = null;
const REQUIRED_STORES = [RWA.STORE_DOC, RWA.STORE_UNDO, RWA.STORE_HIST, RWA.STORE_FSA];
async function openDB() {
  if (_db) return _db;
  // Open without a version so we work with whatever the existing db version is —
  // hard-coding version 1 fails if a previous session ever opened the db at a higher version.
  const probe = await new Promise((res, rej) => {
    const r = indexedDB.open(RWA.DB);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('db open blocked by another tab'));
  });
  // We expect every required store to use out-of-line keys (keyPath === null).
  // If a store is missing — or exists with the wrong schema (in-line keys from
  // an old prototype) — we need to (re)create it.
  const toRecreate = [];
  for (const name of REQUIRED_STORES) {
    if (!probe.objectStoreNames.contains(name)) { toRecreate.push(name); continue; }
    const store = probe.transaction(name, 'readonly').objectStore(name);
    if (store.keyPath !== null) toRecreate.push(name);
  }
  if (toRecreate.length === 0) { _db = probe; return _db; }
  const newVersion = probe.version + 1;
  probe.close();
  _db = await new Promise((res, rej) => {
    const r = indexedDB.open(RWA.DB, newVersion);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      toRecreate.forEach(name => {
        if (db.objectStoreNames.contains(name)) db.deleteObjectStore(name);
        db.createObjectStore(name); // out-of-line keys
      });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('db upgrade blocked by another tab'));
  });
  return _db;
}
function idbGet(store, key) {
  return openDB().then(db => new Promise((res, rej) => {
    const r = db.transaction(store).objectStore(store).get(key || RWA.KEY);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function idbPut(store, val, key) {
  return openDB().then(db => new Promise((res, rej) => {
    const r = db.transaction(store, 'readwrite').objectStore(store).put(val, key || RWA.KEY);
    r.onsuccess = () => res();
    r.onerror = () => rej(r.error);
  }));
}

// ─── Document storage ───────────────────────────────────────────────
async function getDoc() {
  let doc = await idbGet(RWA.STORE_DOC);
  if (doc == null) { doc = INLINE_DOC; await idbPut(RWA.STORE_DOC, doc); }
  return doc;
}
async function setDoc(doc) { await idbPut(RWA.STORE_DOC, doc); }
async function pushUndo(prev) {
  const stack = (await idbGet(RWA.STORE_UNDO)) || [];
  stack.push(prev);
  while (stack.length > RWA.UNDO_CAP) stack.shift();
  await idbPut(RWA.STORE_UNDO, stack);
}
async function popUndo() {
  const stack = (await idbGet(RWA.STORE_UNDO)) || [];
  if (stack.length === 0) return null;
  const v = stack.pop();
  await idbPut(RWA.STORE_UNDO, stack);
  return v;
}
async function addHist(instr) {
  const list = (await idbGet(RWA.STORE_HIST)) || [];
  const next = [instr, ...list.filter(x => x !== instr)].slice(0, RWA.HIST_CAP);
  await idbPut(RWA.STORE_HIST, next);
  return next;
}
async function getHist() { return (await idbGet(RWA.STORE_HIST)) || []; }

// ─── Renderer ───────────────────────────────────────────────────────
function renderDoc(html) {
  const mount = document.getElementById('rwa-doc-mount');
  mount.innerHTML = html;
  // Re-execute scripts inserted via innerHTML (innerHTML doesn't run them).
  mount.querySelectorAll('script').forEach(old => {
    const s = document.createElement('script');
    for (const a of old.attributes) s.setAttribute(a.name, a.value);
    s.textContent = old.textContent;
    old.parentNode.replaceChild(s, old);
  });
  // Wire TOC active-state for sections that scroll into view.
  wireToc();
}
function wireToc() {
  const sections = document.querySelectorAll('.rwa-doc-section');
  if (!sections.length) return;
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id;
        document.querySelectorAll('.rwa-doc-toc').forEach(a =>
          a.classList.toggle('active', a.getAttribute('href') === '#' + id));
      }
    });
  }, { threshold: 0.2 });
  sections.forEach(s => obs.observe(s));
}

// ─── Bootstrap snapshot capture ─────────────────────────────────────
// Captures the file's "frozen" form (with empty mount points) at boot,
// before the document is rendered. Used as the template at commit time:
// only the INLINE_DOC literal contents change between commits.
let FROZEN = '';
function captureBootstrap() {
  FROZEN = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
}
function escapeForTL(s) {
  return s
    .replace(/\\/g, '\\\\')
    .replace(/`/g, '\\`')
    .replace(/\$\{/g, '\\${')
    .replace(/<\/script/gi, '<\\/script'); // prevent the HTML parser from ending the bootstrap script tag
}
function buildFile(currentDoc) {
  const marker = 'const INLINE_DOC = `';
  const start = FROZEN.indexOf(marker);
  if (start < 0) throw new Error('cannot locate INLINE_DOC literal');
  const cs = start + marker.length;
  let i = cs;
  while (i < FROZEN.length) {
    if (FROZEN[i] === '\\') { i += 2; continue; }
    if (FROZEN[i] === '`') break;
    i++;
  }
  if (i >= FROZEN.length) throw new Error('unterminated INLINE_DOC literal');
  return FROZEN.slice(0, cs) + escapeForTL(currentDoc) + FROZEN.slice(i);
}

// ─── Runtime UI ─────────────────────────────────────────────────────
function buildRuntimeUI() {
  const root = document.getElementById('rwa-runtime');
  root.innerHTML = `
<div id="rwa-set">
  <button class="rwa-st-btn" id="rwa-st-status">● ready</button>
  <button class="rwa-st-btn" id="rwa-st-cog">⚙</button>
  <button class="rwa-st-btn pri" id="rwa-st-commit">⌘S</button>
</div>
<div id="rwa-set-panel">
  <div class="rwa-set-row">
    <label>OpenRouter Key</label>
    <input type="password" id="rwa-key" placeholder="sk-or-..." autocomplete="off">
  </div>
  <div class="rwa-set-row">
    <label>Model</label>
    <input type="text" id="rwa-model" autocomplete="off">
  </div>
  <div class="rwa-set-row">
    <div class="rwa-set-info">Key lives in sessionStorage only — cleared on tab close. Document, undo, and history live in IndexedDB.</div>
  </div>
  <div class="rwa-set-row">
    <button class="rwa-b warn" id="rwa-reset">⟲ Reset document to inline snapshot</button>
  </div>
</div>
<div id="rwa-pal">
  <div id="rwa-pal-box">
    <div class="rwa-pal-top">
      <span class="rwa-pal-sig">⌘K</span>
      <input id="rwa-pal-inp" placeholder="modify this document..." autocomplete="off" spellcheck="false">
      <button id="rwa-pal-go" disabled>Run ↵</button>
    </div>
    <div id="rwa-pal-hist"></div>
    <div class="rwa-pal-foot">
      <span id="rwa-pal-st">● ready</span>
      <div class="rwa-pal-acts">
        <button class="rwa-b" id="rwa-act-undo">⌘Z undo</button>
        <button class="rwa-b" id="rwa-act-commit">⌘S commit</button>
      </div>
    </div>
  </div>
</div>`;

  const keyInp = document.getElementById('rwa-key');
  const modelInp = document.getElementById('rwa-model');
  keyInp.value = sessionStorage.getItem(RWA.KEY_API) || '';
  modelInp.value = sessionStorage.getItem(RWA.KEY_MODEL) || RWA.DEFAULT_MODEL;
  keyInp.oninput = e => sessionStorage.setItem(RWA.KEY_API, e.target.value.trim());
  modelInp.oninput = e => sessionStorage.setItem(RWA.KEY_MODEL, e.target.value.trim() || RWA.DEFAULT_MODEL);

  document.getElementById('rwa-st-cog').onclick = () =>
    document.getElementById('rwa-set-panel').classList.toggle('open');
  document.getElementById('rwa-st-commit').onclick = () => commit();
  document.getElementById('rwa-reset').onclick = async () => {
    if (!confirm('Reset the document to its inline snapshot? Undo history will be cleared.')) return;
    await idbPut(RWA.STORE_DOC, INLINE_DOC);
    await idbPut(RWA.STORE_UNDO, []);
    renderDoc(INLINE_DOC);
    setDirty(false);
    setStatus('ok', '⟲ reset');
    document.getElementById('rwa-set-panel').classList.remove('open');
  };

  const pal = document.getElementById('rwa-pal');
  const inp = document.getElementById('rwa-pal-inp');
  const go = document.getElementById('rwa-pal-go');
  pal.onclick = e => { if (e.target === pal) closePalette(); };
  inp.oninput = () => { go.disabled = !inp.value.trim(); };
  inp.onkeydown = e => {
    if (e.key === 'Enter' && !e.shiftKey && inp.value.trim()) { e.preventDefault(); modify(inp.value.trim()); }
    if (e.key === 'Escape') closePalette();
  };
  go.onclick = () => inp.value.trim() && modify(inp.value.trim());
  document.getElementById('rwa-act-undo').onclick = () => { closePalette(); undo(); };
  document.getElementById('rwa-act-commit').onclick = () => { closePalette(); commit(); };
}

async function refreshHist() {
  const items = await getHist();
  const hist = document.getElementById('rwa-pal-hist');
  if (!hist) return;
  hist.innerHTML = items.map(h =>
    `<div class="rwa-hi" data-p="${escapeAttr(h)}">↻ ${escapeHTML(h)}</div>`
  ).join('');
  hist.querySelectorAll('.rwa-hi').forEach(el => {
    el.onclick = () => {
      const inp = document.getElementById('rwa-pal-inp');
      inp.value = el.dataset.p;
      document.getElementById('rwa-pal-go').disabled = false;
      inp.focus();
    };
  });
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

function openPalette() {
  document.getElementById('rwa-pal').classList.add('open');
  requestAnimationFrame(() => document.getElementById('rwa-pal-inp').focus());
  refreshHist();
  setPalStatus('', '● ready');
}
function closePalette() {
  document.getElementById('rwa-pal').classList.remove('open');
  document.getElementById('rwa-pal-inp').value = '';
  document.getElementById('rwa-pal-go').disabled = true;
}

function setStatus(cls, msg) {
  const el = document.getElementById('rwa-st-status');
  if (!el) return;
  el.className = 'rwa-st-btn ' + (cls || '');
  el.textContent = msg;
}
function setPalStatus(cls, msg) {
  const el = document.getElementById('rwa-pal-st');
  if (!el) return;
  el.className = cls || '';
  el.textContent = msg;
}

let _dirty = false;
function setDirty(d) {
  _dirty = d;
  const btn = document.getElementById('rwa-st-commit');
  if (btn) btn.classList.toggle('dirty', d);
}

// ─── ⌘K Modify ──────────────────────────────────────────────────────
const SYSTEM_PROMPT = `You are modifying a document. The document may be prose, it may be a tracker, it may be a spreadsheet, it may be all three. Read what is there. Apply the user's instruction to the actual content — its tone if it is prose, its structure if it is data, its behavior if it is interactive.

Return the complete modified document only — no commentary, no markdown fence. The document is an HTML fragment that lives inside a mount div. CSS may be inline in <style> tags; JS may be inline in <script> tags. Do NOT include <!DOCTYPE>, <html>, <head>, or <body> — those belong to the bootstrap. Use the existing structure and conventions of the document. The first character of your response should begin the modified content directly.

A document-first response: less reflexive interactivity, more attention to prose tone and visual structure when those are what the user is editing. A user editing a press release does not want a button bar; a user editing a budget tracker does not want filler prose. Do not invent a runtime or a self-modification UI — the bootstrap provides those.`;

async function modify(instruction) {
  const key = sessionStorage.getItem(RWA.KEY_API);
  const model = sessionStorage.getItem(RWA.KEY_MODEL) || RWA.DEFAULT_MODEL;
  if (!key) {
    setPalStatus('err', 'no API key — open ⚙ settings');
    document.getElementById('rwa-set-panel').classList.add('open');
    document.getElementById('rwa-key').focus();
    return;
  }
  closePalette();
  setStatus('run', '⌘K running');
  try {
    const cur = await getDoc();
    const r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + key,
        'HTTP-Referer': 'https://github.com/ikangai/rewritable',
        'X-Title': RWA.TITLE,
      },
      body: JSON.stringify({
        model: model,
        max_tokens: 32000,
        messages: [
          { role: 'system', content: SYSTEM_PROMPT },
          { role: 'user', content: 'Document:\n' + cur + '\n\nInstruction: ' + instruction },
        ],
      }),
    });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error((e.error && e.error.message) || r.statusText);
    }
    const data = await r.json();
    let text = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
    text = text.trim();
    const fence = '```';
    if (text.startsWith(fence)) {
      const nl = text.indexOf('\n');
      if (nl > 0) text = text.slice(nl + 1);
    }
    if (text.endsWith(fence)) text = text.slice(0, text.lastIndexOf(fence)).trim();
    if (text.length === 0) throw new Error('empty response');
    await pushUndo(cur);
    await setDoc(text);
    await addHist(instruction);
    renderDoc(text);
    setDirty(true);
    setStatus('ok', '✓ done');
  } catch (e) {
    setStatus('err', '✗ ' + e.message);
    console.error(e);
  }
}

// ─── ⌘Z Undo ────────────────────────────────────────────────────────
async function undo() {
  const prev = await popUndo();
  if (!prev) { setStatus('err', '✗ nothing to undo'); return; }
  await setDoc(prev);
  renderDoc(prev);
  setDirty(true);
  setStatus('ok', '↩ undone');
}

// ─── ⌘S Commit ──────────────────────────────────────────────────────
async function commit() {
  setStatus('run', '⌘S writing');
  try {
    const doc = await getDoc();
    const fileText = buildFile(doc);
    if ('showSaveFilePicker' in window) {
      let handle = null;
      try { handle = await idbGet(RWA.STORE_FSA); } catch (_) {}
      try {
        if (handle) {
          let perm = await handle.queryPermission({ mode: 'readwrite' });
          if (perm === 'prompt') perm = await handle.requestPermission({ mode: 'readwrite' });
          if (perm !== 'granted') throw new Error('permission denied');
        } else {
          handle = await window.showSaveFilePicker({
            suggestedName: RWA.FILENAME,
            types: [{ description: 'HTML', accept: { 'text/html': ['.html', '.htm'] } }],
          });
          await idbPut(RWA.STORE_FSA, handle);
        }
        const w = await handle.createWritable();
        await w.write(fileText);
        await w.close();
        setDirty(false);
        setStatus('ok', '✓ committed');
        return;
      } catch (e) {
        if (e.name === 'AbortError') { setStatus('', 'cancelled'); return; }
        console.warn('FSA failed, falling back to download:', e);
      }
    }
    const a = document.createElement('a');
    const blob = new Blob([fileText], { type: 'text/html' });
    a.href = URL.createObjectURL(blob);
    a.download = RWA.FILENAME;
    a.click();
    URL.revokeObjectURL(a.href);
    setDirty(false);
    setStatus('ok', '✓ exported');
  } catch (e) {
    setStatus('err', '✗ ' + e.message);
    console.error(e);
  }
}

// ─── Keyboard ───────────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const mod = navigator.platform.includes('Mac') ? e.metaKey : e.ctrlKey;
  if (!mod) return;
  if (e.key === 'k') {
    e.preventDefault();
    document.getElementById('rwa-pal').classList.contains('open') ? closePalette() : openPalette();
  } else if (e.key === 'z') {
    e.preventDefault(); undo();
  } else if (e.key === 's') {
    e.preventDefault(); commit();
  }
});

// ─── Boot ───────────────────────────────────────────────────────────
(async () => {
  try {
    captureBootstrap();
    buildRuntimeUI();
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    const doc = await getDoc();
    renderDoc(doc);
    setStatus('ok', '● ready');
  } catch (e) {
    document.body.innerHTML = '<pre style="color:#ff5757;padding:24px;font-family:monospace;">Bootstrap error: ' + escapeHTML(e.message) + '</pre>';
    console.error(e);
  }
})();
</script>
</body>
</html>
