<h1>نصائح لزيارة قصر الحمراء</h1>
<p>الفقرة الأولى ترحب بالقارئ. تحتوي على معلومات عامة عن قصر الحمراء.</p>
<p>الفقرة الثانية تعطي تفاصيل عن مواعيد الزيارة. تحتوي على نصائح عملية للزوار.</p>
<p>تنبيه برمجي: <bdo dir="ltr"><code>setTimeout(fn, 1000)</code></bdo> لجدولة الإشعارات.</p>
<p>الفقرة الأخيرة تختم النص بنصائح للزوار الجدد.</p>
