[general]
# DNS listen interface. Must own UDP/53 (and TCP/53 for large responses)
# on the public IP of the VPS.
listen = "0.0.0.0:53"
protocol = "both"

# The zone this acme-dns instance is authoritative for. World4You
# delegates the entire acme-dns.ikangai.com zone here via an NS record;
# all queries for *.acme-dns.ikangai.com land at this container.
domain = "acme-dns.ikangai.com"

# Hostname this nameserver advertises in SOA / NS responses. Must match
# the NS record set at World4You.
nsname = "acme-dns.ikangai.com"

# SOA admin contact, in dot-separated form (RFC 1035 convention: replace
# the @ in an email address with a dot).
nsadmin = "admin.ikangai.com"

# Static records served at the apex of this zone. The A record is the
# *glue* that resolvers use to reach the nameserver after following the
# NS delegation from World4You. The NS record points the zone at itself.
records = [
    "acme-dns.ikangai.com. A 185.164.4.77",
    "acme-dns.ikangai.com. NS acme-dns.ikangai.com.",
]

debug = false

[database]
engine = "sqlite3"
# Persists registrations and TXT-record updates. Mounted via a Docker
# named volume so it survives container rebuilds.
connection = "/var/lib/acme-dns/acme-dns.db"

[api]
# Bind inside the container on all interfaces; the docker-compose file
# exposes this port only to 127.0.0.1 on the host (and to the
# router_web docker network where Traefik reaches it).
ip = "0.0.0.0"
port = "80"

# Open during initial registration. Flip to true after Task 1 step 4
# captures the credentials, then restart the container, so no further
# accounts can be created. Existing credentials keep working.
disable_registration = false

# No TLS on the HTTP API — exposure is localhost / docker-internal only.
tls = "none"

# CORS — irrelevant for our use; Traefik calls via Go HTTP client, not a
# browser. Left at default for the registration curl from the same host.
corsorigins = ["*"]

use_header = false
header_name = "X-Forwarded-For"

[logconfig]
loglevel = "info"
logtype = "stdout"
logformat = "text"
