services:
  rewritable:
    build:
      context: ..
      dockerfile: service/Dockerfile
    image: ikangai/rewritable-new:latest
    container_name: rewritable-new
    restart: always
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      # Apex router — rewritable.ikangai.com itself. Existing HTTP-01
      # letsencrypt cert (unchanged from pre-share-isolation).
      - "traefik.http.routers.rewritable-apex.rule=Host(`rewritable.ikangai.com`)"
      - "traefik.http.routers.rewritable-apex.entrypoints=websecure"
      - "traefik.http.routers.rewritable-apex.tls.certresolver=letsencrypt"
      - "traefik.http.routers.rewritable-apex.service=rewritable-svc"
      # Share router — <short>.rewritable.ikangai.com where <short> is
      # exactly 8 lowercase-alphanumeric chars. The 8-char regex reserves
      # that namespace by convention so future apex-style subdomains
      # (api., docs., etc.) of non-8-char-lowercase length don't collide.
      # Uses the wildcard cert (*.rewritable.ikangai.com) issued via
      # letsencrypt-dns + auth.acme-dns.io. Single-quoted YAML so the
      # regex backslashes pass through unescaped.
      - 'traefik.http.routers.rewritable-shares.rule=HostRegexp(`^[0-9a-z]{8}\.rewritable\.ikangai\.com$`)'
      - "traefik.http.routers.rewritable-shares.entrypoints=websecure"
      - "traefik.http.routers.rewritable-shares.tls.certresolver=letsencrypt-dns"
      - "traefik.http.routers.rewritable-shares.tls.domains[0].main=rewritable.ikangai.com"
      - "traefik.http.routers.rewritable-shares.tls.domains[0].sans=*.rewritable.ikangai.com"
      - "traefik.http.routers.rewritable-shares.service=rewritable-svc"
      # Hosted-edit router — <id>.rewritable.ikangai.com where <id> is exactly
      # 12 lowercase-alphanumeric chars. DELIBERATELY a different length from the
      # 8-char share pattern so the two HostRegexp rules are mutually exclusive
      # (a host can never match both). Each hosted rwa thus gets its own isolated
      # origin — the /r/ deploy gate (design 2026-08-13 §4.1). Same wildcard cert
      # as shares; no new DNS/cert. Single-quoted YAML so backslashes pass through.
      - 'traefik.http.routers.rewritable-hosted.rule=HostRegexp(`^[0-9a-z]{12}\.rewritable\.ikangai\.com$`)'
      - "traefik.http.routers.rewritable-hosted.entrypoints=websecure"
      - "traefik.http.routers.rewritable-hosted.tls.certresolver=letsencrypt-dns"
      - "traefik.http.routers.rewritable-hosted.tls.domains[0].main=rewritable.ikangai.com"
      - "traefik.http.routers.rewritable-hosted.tls.domains[0].sans=*.rewritable.ikangai.com"
      - "traefik.http.routers.rewritable-hosted.service=rewritable-svc"
      # Service definition — single backend, shared by all routers.
      - "traefik.http.services.rewritable-svc.loadbalancer.server.port=80"
    networks:
      - router_web
    # Snapshot publishing storage. Named volume so shares survive image
    # rebuilds; 24h expiry sweep keeps it from growing unbounded.
    volumes:
      - rwa_shares:/app/service/data

networks:
  router_web:
    external: true

volumes:
  rwa_shares:
