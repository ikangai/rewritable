services:
  rewritable:
    build:
      context: ..
      dockerfile: service/Dockerfile
    image: ikangai/rewritable-new:latest
    container_name: rewritable-new
    restart: always
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rewritable.rule=Host(`rewritable.ikangai.com`)"
      - "traefik.http.routers.rewritable.entrypoints=websecure"
      - "traefik.http.routers.rewritable.tls.certresolver=letsencrypt"
      - "traefik.http.services.rewritable.loadbalancer.server.port=80"
    networks:
      - router_web
    # Snapshot publishing storage. Named volume so shares survive image
    # rebuilds; 24h expiry sweep keeps it from growing unbounded.
    volumes:
      - rwa_shares:/app/service/data

networks:
  router_web:
    external: true

volumes:
  rwa_shares:
