<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>import — re-writeable</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center;
    background: #0a0a0a; color: #e5e5e5;
  }
  main { width: min(36rem, 90vw); padding: 2rem; text-align: center; }
  h1 { font-size: 1.5rem; font-weight: 400; margin: 0 0 1.5rem; }
  .drop {
    border: 1px dashed #444; border-radius: 8px;
    padding: 2.5rem 1.5rem; cursor: pointer;
    transition: border-color .15s, background .15s;
    color: #b8b8b8;
  }
  .drop:hover, .drop.over { border-color: #b8ff57; background: #111; color: #e5e5e5; }
  .drop.busy { opacity: .6; cursor: progress; }
  .drop label { color: #b8ff57; cursor: inherit; text-decoration: underline; }
  .status { min-height: 1.25rem; margin: 1rem 0 0; font-size: .9rem; opacity: .8; }
  .status.error { color: #ff5757; opacity: 1; }
  .status.ok { color: #b8ff57; opacity: 1; }
  .nav { margin-top: 2rem; font-size: .85rem; opacity: .6; }
  .nav a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>import a file</h1>
  <div id="drop" class="drop" role="button" tabindex="0">
    drop a <code>.md</code>, <code>.csv</code>, <code>.docx</code>, or <code>.pdf</code> file here, or <label for="picker">choose one</label>
    <input id="picker" type="file"
           accept=".md,.markdown,text/markdown,.csv,text/csv,.docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.pdf,application/pdf"
           hidden>
  </div>
  <p id="status" class="status"></p>
  <p class="nav"><a href="/new">start with a blank container instead</a></p>
</main>
<!-- marked + papaparse + mammoth + pdf.js versions pinned to match
     cli/package.json's resolved versions. When the CLI's deps are bumped,
     bump these tags + SRI together so /import stays byte-equivalent to
     `rwa import`. SRI recipe:
     curl -sL https://cdnjs.cloudflare.com/ajax/libs/<lib>/<ver>/<file>.min.js | openssl dgst -sha512 -binary | openssl base64 -A -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/14.1.4/marked.min.js"
        integrity="sha512-oUb+v+OGnC4ls/U+74UExKiWPxg/0M1AW6WGR94XFExsapAwqFRWwG1uds2YO/k38mAaai62SKhsMQHbIYX5Rw=="
        crossorigin="anonymous"
        onerror="document.getElementById('status').textContent='marked failed to load — check your connection';document.getElementById('status').className='status error';document.getElementById('drop').classList.add('busy');"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"
        integrity="sha512-dfX5uYVXzyU8+KHqj8bjo7UkOdg18PaOtpa48djpNbZHwExddghZ+ZmzWT06R5v6NSk3ZUfsH6FNEDepLx9hPQ=="
        crossorigin="anonymous"
        onerror="document.getElementById('status').textContent='papaparse failed to load — check your connection';document.getElementById('status').className='status error';document.getElementById('drop').classList.add('busy');"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"
        integrity="sha512-Bpw1G70k1RT4pADRSajgVrcxVbAl0Ymw1UVr1EmeXxidZLp5MzAqkBx3zPK02UuvCnz4Ly7trvpJ1Zu/t2X1kQ=="
        crossorigin="anonymous"
        onerror="document.getElementById('status').textContent='mammoth failed to load — check your connection';document.getElementById('status').className='status error';document.getElementById('drop').classList.add('busy');"></script>
<!-- pdf.js 5.x is ESM-only on cdnjs. SRI on `<script type="module">` does NOT
     validate the URL the inline body imports — it only validates the script's
     own body, which is empty here. So we self-host pdf.js (same-origin, served
     from /pdf/) instead of trusting cdnjs. Bumping the CLI's pdfjs-dist
     version means re-copying service/public/pdf/{pdf.min.mjs,pdf.worker.min.mjs}
     from cli/node_modules/pdfjs-dist/build/. The worker file URL is set on
     GlobalWorkerOptions so pdfjs spawns it from the same origin. -->
<script type="module">
  try {
    const pdfjs = await import('/pdf/pdf.min.mjs');
    pdfjs.GlobalWorkerOptions.workerSrc = '/pdf/pdf.worker.min.mjs';
    window.pdfjs = pdfjs;
  } catch (err) {
    const s = document.getElementById('status');
    s.textContent = 'pdf.js failed to load — ' + (err && err.message ? err.message : 'unknown error');
    s.className = 'status error';
  }
</script>
<script>
'use strict';

// PORTED FROM cli/src/seed.mjs, cli/src/commands.mjs, and cli/src/import.mjs —
// keep in sync. The CLI is the source of truth; this file mirrors splice +
// converter logic in the browser. Four sites must stay aligned: the CLI
// modules above plus seeds/rewritable.html (for the splice marker shape).
// If the seed grows a new substitution site, the INLINE_DOC marker shape
// changes, or any converter signature/heuristic shifts, update everywhere.

const TITLE_RE = /<title>[^<]*<\/title>/;
const FILE_RE = /(FILE\s*:\s*)'[^']*'/;
const INLINE_DOC_MARKER = 'const INLINE_DOC = `';

const escapeHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const escapeJsString = s => s.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
const canonLF = s => s == null ? '' : String(s).replace(/\r\n/g, '\n').replace(/\r/g, '\n');
const escapeTL = s => canonLF(s)
  .replace(/\\/g, '\\\\')
  .replace(/`/g, '\\`')
  .replace(/\$\{/g, '\\${')
  .replace(/<\/script/gi, '<\\/script');

function titleFromBasename(basename) {
  return basename
    .replace(/[-_]+/g, ' ')
    .split(' ')
    .filter(Boolean)
    .map(w => w[0].toUpperCase() + w.slice(1))
    .join(' ') || 'Untitled';
}

function applyTitleAndFileSubs(seed, { title, fileMeta }) {
  for (const { re, label } of [
    { re: TITLE_RE, label: '<title>' },
    { re: FILE_RE, label: 'FILE:' },
  ]) {
    const matches = seed.match(new RegExp(re.source, 'g')) || [];
    if (matches.length !== 1) {
      throw new Error(`seed must contain exactly one ${label} line, found ${matches.length}`);
    }
  }
  let out = seed.replace(TITLE_RE, `<title>${escapeHtml(title)}</title>`);
  out = out.replace(FILE_RE, (_m, prefix) => `${prefix}'${escapeJsString(fileMeta)}'`);
  return out;
}

function replaceInlineDoc(seed, newDoc) {
  const start = seed.indexOf(INLINE_DOC_MARKER);
  if (start < 0) throw new Error('cannot locate INLINE_DOC marker in seed');
  const cs = start + INLINE_DOC_MARKER.length;
  let i = cs;
  while (i < seed.length) {
    if (seed[i] === '\\') { i += 2; continue; }
    if (seed[i] === '`') break;
    i++;
  }
  if (i >= seed.length) throw new Error('unterminated INLINE_DOC literal in seed');
  return seed.slice(0, cs) + escapeTL(newDoc) + seed.slice(i);
}

function looksLikeCsv(text) {
  const probe = Papa.parse(text, { preview: 2, skipEmptyLines: true, header: false });
  if (probe.errors.length > 0) return false;
  if (probe.data.length === 0) return false;
  const cols = probe.data[0].length;
  if (cols < 2) return false;
  if (probe.data.length === 2 && probe.data[1].length !== cols) return false;
  return true;
}

function convertCsv(text) {
  if (!looksLikeCsv(text)) {
    throw new Error('csv probe failed: input does not look like CSV (need ≥2 columns with consistent column count)');
  }
  const result = Papa.parse(text, { skipEmptyLines: true, header: false });
  // Errors are kept as warnings; Papa is lenient and produces partial data,
  // matching the CLI's behavior where parse errors don't abort the import.
  const rows = result.data;
  if (rows.length === 0) {
    return { html: '<article>\n</article>', warnings: [] };
  }
  const escape = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const [header, ...body] = rows;
  const thead = `<thead>\n<tr>${header.map(c => `<th>${escape(c)}</th>`).join('')}</tr>\n</thead>`;
  const tbody = body.length === 0
    ? ''
    : `\n<tbody>\n${body.map(row => `<tr>${row.map(c => `<td>${escape(c)}</td>`).join('')}</tr>`).join('\n')}\n</tbody>`;
  return { html: `<article>\n<table>\n${thead}${tbody}\n</table>\n</article>`, warnings: [] };
}

async function convertDocx(arrayBuffer) {
  let result;
  try {
    result = await mammoth.convertToHtml({ arrayBuffer });
  } catch (err) {
    throw new Error('docx: ' + (err && err.message ? err.message : String(err)));
  }
  const raw = (result.value || '').trim();
  if (!raw) throw new Error('docx: produced empty document — input may be corrupt or empty');
  const { html, skipped } = sanitizeMammothUrls(raw);
  const warnings = [
    ...skipped.map(s => `docx: ${s}`),
    ...(result.messages || []).map(m => `docx: ${m.message}`),
  ];
  return { html: `<article>\n${html}\n</article>`, warnings };
}

// Mammoth doesn't filter URL schemes — a docx with a `javascript:` hyperlink
// would land in the imported document and execute on click (stored XSS in the
// downloaded rwa container). Mirror of cli/src/import.mjs sanitizeMammothUrls.
const _SAFE_HREF_SCHEMES = new Set(['http', 'https', 'mailto', 'tel']);
function _attrIsSafe(attr, val) {
  const m = val.match(/^\s*([a-z][a-z0-9+.\-]*):/i);
  if (!m) return true;
  const proto = m[1].toLowerCase();
  if (_SAFE_HREF_SCHEMES.has(proto)) return true;
  if (attr === 'src' && proto === 'data' && /^\s*data:image\//i.test(val)) return true;
  return false;
}
function sanitizeMammothUrls(html) {
  const skipped = [];
  const stripAttr = (attr) => (full, val) => {
    if (_attrIsSafe(attr, val)) return full;
    const m = val.match(/^\s*([a-z][a-z0-9+.\-]*):/i);
    const scheme = m ? m[1].toLowerCase() : 'unknown';
    skipped.push(`stripped unsafe ${attr} (scheme: ${scheme}:)`);
    return `${attr}="#"`;
  };
  return {
    html: html
      .replace(/href="([^"]*)"/g, stripAttr('href'))
      .replace(/src="([^"]*)"/g, stripAttr('src')),
    skipped,
  };
}

async function convertPdf(arrayBuffer) {
  if (!window.pdfjs) throw new Error('pdf.js is not loaded yet — wait a moment and try again');
  const data = new Uint8Array(arrayBuffer);
  let doc;
  try {
    doc = await window.pdfjs.getDocument({ data, isEvalSupported: false }).promise;
  } catch (err) {
    if (err && err.name === 'PasswordException') {
      throw new Error('pdf: file is password-protected');
    }
    throw new Error('pdf: ' + (err && err.message ? err.message : String(err)));
  }
  const escape = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const paragraphs = [];
  for (let p = 1; p <= doc.numPages; p++) {
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    extractParagraphs(tc.items).forEach(line => paragraphs.push(line));
    paragraphs.push(null);
  }
  await doc.destroy().catch(() => {});

  const blocks = [];
  let buf = [];
  const flush = () => {
    const joined = buf.join(' ').replace(/\s+/g, ' ').trim();
    if (joined) blocks.push(`<p>${escape(joined)}</p>`);
    buf = [];
  };
  for (const line of paragraphs) {
    if (line === null || line === '') { flush(); continue; }
    buf.push(line);
  }
  flush();

  if (blocks.length === 0) {
    throw new Error('pdf: no extractable text — this looks like a scanned/image PDF; OCR is not supported');
  }
  return {
    html: `<article>\n${blocks.join('\n')}\n</article>`,
    warnings: ['pdf: layout reconstructed by heuristics — review headings/lists manually'],
  };
}

// Mirror of cli/src/import.mjs extractParagraphs — same heuristic.
function extractParagraphs(items) {
  if (!items || items.length === 0) return [];
  const rows = items.map(it => ({
    str: it.str,
    y: it.transform ? it.transform[5] : 0,
    x: it.transform ? it.transform[4] : 0,
    h: it.height || (it.transform ? Math.abs(it.transform[3]) : 0) || 12,
  }));
  // Sort top-to-bottom (y desc), then left-to-right. See cli/src/import.mjs
  // for the rationale.
  rows.sort((a, b) => b.y - a.y || a.x - b.x);
  const lines = [];
  let cur = null;
  for (const r of rows) {
    if (cur && Math.abs(r.y - cur.y) <= cur.h * 0.5) {
      cur.parts.push(r);
      cur.y = (cur.y + r.y) / 2;
    } else {
      if (cur) lines.push(cur);
      cur = { y: r.y, h: r.h, parts: [r] };
    }
  }
  if (cur) lines.push(cur);
  const out = [];
  let prevY = null, prevH = null;
  for (const line of lines) {
    line.parts.sort((a, b) => a.x - b.x);
    const text = line.parts.map(p => p.str).join(' ').replace(/\s+/g, ' ').trim();
    if (prevY != null) {
      const gap = Math.abs(prevY - line.y);
      if (gap > prevH * 1.5) out.push('');
    }
    if (text) out.push(text);
    prevY = line.y;
    prevH = line.h;
  }
  return out;
}

// --- UI wiring ---

const dropEl = document.getElementById('drop');
const pickerEl = document.getElementById('picker');
const statusEl = document.getElementById('status');

function setStatus(msg, kind) {
  statusEl.textContent = msg || '';
  statusEl.className = 'status' + (kind ? ' ' + kind : '');
}
function showError(msg) { setStatus(msg, 'error'); dropEl.classList.remove('busy'); }

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  // Revoke after a tick so the click has time to register.
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

const TEXTUAL = new Set(['md', 'markdown', 'csv']);
const BINARY = new Set(['docx', 'pdf']);

async function handleFile(file) {
  if (!file) return;
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if (!TEXTUAL.has(ext) && !BINARY.has(ext)) {
    return showError(`unsupported format: .${ext || '(none)'} (only .md / .markdown / .csv / .docx / .pdf)`);
  }
  if ((ext === 'md' || ext === 'markdown') && typeof marked === 'undefined') {
    return showError('marked is not loaded — cannot convert');
  }
  if (ext === 'csv' && typeof Papa === 'undefined') {
    return showError('papaparse is not loaded — cannot convert');
  }
  if (ext === 'docx' && typeof mammoth === 'undefined') {
    return showError('mammoth is not loaded — cannot convert');
  }
  if (ext === 'pdf' && !window.pdfjs) {
    return showError('pdf.js is not loaded — cannot convert');
  }
  dropEl.classList.add('busy');
  setStatus('converting…');
  try {
    let html, warnings = [];
    if (ext === 'md' || ext === 'markdown') {
      const text = await file.text();
      if (!text.trim()) return showError('file is empty');
      // marked.parse can be sync or return a Promise depending on options;
      // await handles both safely.
      const parsed = await marked.parse(text, { gfm: true, breaks: false });
      html = `<article>\n${String(parsed).trim()}\n</article>`;
    } else if (ext === 'csv') {
      const text = await file.text();
      if (!text.trim()) return showError('file is empty');
      ({ html, warnings } = convertCsv(text));
    } else if (ext === 'docx') {
      const buf = await file.arrayBuffer();
      ({ html, warnings } = await convertDocx(buf));
    } else if (ext === 'pdf') {
      const buf = await file.arrayBuffer();
      ({ html, warnings } = await convertPdf(buf));
    }
    for (const w of warnings) console.warn(w);
    const seedRes = await fetch('/rewritable.html', { cache: 'no-store' });
    if (!seedRes.ok) return showError(`could not fetch seed (${seedRes.status})`);
    const seed = await seedRes.text();
    const baseName = file.name.replace(/\.(md|markdown|csv|docx|pdf)$/i, '');
    const outName = `${baseName}.html`;
    const title = titleFromBasename(baseName);
    const subbed = applyTitleAndFileSubs(seed, { title, fileMeta: outName });
    const result = replaceInlineDoc(subbed, html);
    triggerDownload(new Blob([result], { type: 'text/html' }), outName);
    const suffix = warnings.length ? ` (${warnings.length} note${warnings.length === 1 ? '' : 's'} — see console)` : '';
    setStatus(`downloaded ${outName}${suffix}`, 'ok');
  } catch (err) {
    showError(err && err.message ? err.message : String(err));
  } finally {
    dropEl.classList.remove('busy');
  }
}

dropEl.addEventListener('click', () => pickerEl.click());
dropEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pickerEl.click(); }
});
pickerEl.addEventListener('change', () => {
  if (pickerEl.files && pickerEl.files[0]) handleFile(pickerEl.files[0]);
  pickerEl.value = '';
});
['dragenter', 'dragover'].forEach(evt => dropEl.addEventListener(evt, e => {
  e.preventDefault(); dropEl.classList.add('over');
}));
['dragleave', 'drop'].forEach(evt => dropEl.addEventListener(evt, e => {
  e.preventDefault(); dropEl.classList.remove('over');
}));
dropEl.addEventListener('drop', e => {
  if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) {
    handleFile(e.dataTransfer.files[0]);
  }
});
</script>
</body>
</html>
