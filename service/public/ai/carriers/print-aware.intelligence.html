<!-- 7b: worker-scoped CSP via page-policy inheritance. A blob Worker has no CSP of
     its own — it inherits THIS document's policy (CSP3 §2.5.5), so this <meta> also
     governs every skill Worker. `script-src 'unsafe-inline' blob:` runs the inline
     bootstrap + blob worker code but admits NO remote origin, so a skill's dynamic
     import()/importScripts()/Function-constructor cannot load or eval remote code —
     the structural wall that closes F1 (the one Worker network channel §5a's
     global-removal can't shut, because import() is a syntactic operator, not a
     `self` property). Deliberately NO connect-src / default-src: the page must reach
     runtime-configurable agent backends (⌘K) and render inline styles + skins, and
     the worker has no direct fetch (§5a removes it) so connect-src is moot there;
     adding either was measured to break ⌘K + skinning. Edit-unreachable (frozen
     <head>, above INLINE_DOC). Verified in real Chromium at file://. -->
<meta http-equiv="Content-Security-Policy" content="script-src 'unsafe-inline' blob:; worker-src blob:; object-src 'none'">

#rwa-lens-hist-panel h3{font-family:var(--font-ui);font-size:14px;font-weight:600;color:var(--gray-900);margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;}

#rwa-lens-hist-panel h3 button:hover{color:var(--gray-700);}
#rwa-lens-hist-panel .rwa-hist-row{padding:10px 0;border-bottom:1px solid var(--gray-100);}

#rwa-lens-hist-panel .rwa-hist-meta{display:flex;gap:8px;align-items:center;margin-bottom:4px;color:var(--gray-400);font-size:11px;font-family:var(--font-mono);}
#rwa-lens-hist-panel .rwa-hist-surface{background:var(--gray-100);color:var(--gray-600);padding:2px 8px;border-radius:100px;font-size:9px;letter-spacing:.5px;text-transform:uppercase;font-family:var(--font-mono);}
#rwa-lens-hist-panel .rwa-hist-actor{background:var(--gray-50);color:var(--gray-500);padding:2px 8px;border-radius:100px;font-size:9px;letter-spacing:.3px;font-family:var(--font-mono);max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#rwa-lens-hist-panel .rwa-hist-instr{color:var(--gray-900);word-wrap:break-word;}
#rwa-lens-hist-panel .rwa-hist-empty{color:var(--gray-400);font-style:italic;padding:12px 0;}
/* Inline progress chip above the textarea: shows what the agent is doing
   during in-flight modify() / runAnchoredCommand() / modifyViaBridge() runs.
   States: thinking (default, shows spinner), done (green check, auto-clears),
   error (red, sticks until next submit). Mirrors the affordance pattern from
   Claude.app — keep the user oriented without stealing focus from the input. */
#rwa-lens-progress{display:none;align-items:center;gap:8px;font-family:var(--font-ui);font-size:12px;color:var(--gray-500);font-style:italic;min-height:16px;line-height:16px;}
#rwa-lens-progress[data-state]{display:flex;}
/* The idle "/" hint — the discoverability affordance that replaced the lens input.
   A hint, never an input: pointer-transparent, one line. Shown in Edit mode (via the
   backstop below), hidden while the command palette is open (body.rwa-pal-open). */
#rwa-slash-hint{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:9;max-width:calc(100% - 48px);background:var(--white);border:1px solid var(--gray-200);border-radius:100px;padding:7px 16px;font-size:12px;color:var(--gray-500);box-shadow:0 2px 8px rgba(0,0,0,0.05);pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#rwa-slash-hint b{color:var(--gray-700);font-weight:600;}
#rwa-slash-hint .rwa-slash-hint-key{font-family:var(--font-mono);background:var(--gray-100);border:1px solid var(--gray-200);border-radius:5px;padding:1px 6px;color:var(--gray-900);font-weight:600;}
body.rwa-pal-open #rwa-slash-hint{display:none;}
#rwa-lens-progress[data-state="error"]{color:var(--red);font-style:normal;}
#rwa-lens-progress[data-state="done"]{color:var(--green);font-style:normal;}
.rwa-lens-spinner{display:inline-block;width:10px;height:10px;border-radius:50%;border:1.5px solid var(--gray-200);border-top-color:var(--gray-700);animation:rwa-lens-spin .7s linear infinite;flex-shrink:0;}
#rwa-lens-progress[data-state="error"] .rwa-lens-spinner,
#rwa-lens-progress[data-state="done"] .rwa-lens-spinner{display:none;}
#rwa-lens-progress[data-state="error"]::before{content:'✗';font-weight:600;}
#rwa-lens-progress[data-state="done"]::before{content:'✓';font-weight:600;}
.rwa-lens-prog-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
@keyframes rwa-lens-spin{to{transform:rotate(360deg);}}
.rwa-lens-toast{position:fixed;bottom:140px;left:50%;transform:translateX(-50%);background:var(--gray-900);color:var(--white);padding:10px 16px;border-radius:8px;z-index:11;font-size:13px;font-family:var(--font-ui);box-shadow:0 8px 24px rgba(0,0,0,0.12);}
/* images-v1: drop-position indicator (box-shadow, no layout shift) + hover ✕ chip */
#rwa-doc-mount .rwa-drop-before{box-shadow:0 -3px 0 0 var(--blue);}
#rwa-doc-mount .rwa-drop-after{box-shadow:0 3px 0 0 var(--blue);}
/* images-v1: hover toolbar on an inserted image — S/M/L width presets + ✕ remove */
#rwa-img-chip{position:absolute;z-index:60;display:flex;gap:2px;padding:2px;border-radius:8px;border:1px solid var(--gray-200);background:var(--white);font-family:var(--font-ui);box-shadow:0 1px 4px rgba(0,0,0,0.12);}
#rwa-img-chip button{width:22px;height:22px;border:0;border-radius:6px;background:transparent;color:var(--gray-900);font-size:11px;line-height:1;cursor:pointer;padding:0;font-family:var(--font-ui);}
#rwa-img-chip button:hover{background:var(--gray-100);}
#rwa-img-chip button.on{background:var(--gray-900);color:var(--white);}
/* The bubble floats over the line above the selection. It is pointer-transparent by default
   so a press meant to start a NEW selection passes THROUGH it to the text (otherwise the
   press lands on the bar and its buttons' mousedown-preventDefault swallows the selection —
   the "bubble appears every second selection" bug). It "arms" (becomes clickable) only after
   the pointer deliberately dwells over it (see maybeArmBar). */
#rwa-selection-bar{position:absolute;z-index:70;display:flex;align-items:center;gap:4px;padding:5px;border-radius:10px;border:1px solid var(--gray-200);background:var(--white);box-shadow:0 8px 24px rgba(0,0,0,0.12);font-family:var(--font-ui);pointer-events:none;}

#rwa-selection-bar button.pri{background:var(--gray-900);color:var(--white);}
#rwa-selection-bar button.mono{font-family:var(--font-mono);font-size:11px;}
#rwa-selection-bar button.on{background:var(--gray-900);color:var(--white);}
#rwa-selection-bar .rwa-sel-sep{width:1px;align-self:stretch;margin:2px 1px;background:var(--gray-200);}
#rwa-selection-bar button svg{display:block;}
#rwa-selection-block,#rwa-selection-size{height:28px;border:1px solid var(--gray-200);border-radius:7px;background:var(--white);color:var(--gray-800);font:600 12px var(--font-ui);padding:0 4px;cursor:pointer;}
#rwa-selection-block:hover,#rwa-selection-size:hover{background:var(--gray-100);}

#rwa-selection-cmdwrap[hidden]{display:none;}
#rwa-selection-bar[data-listening="1"] #rwa-selection-voice{background:var(--red);color:var(--white);}
#rwa-selection-cmd,#rwa-selection-link-input{width:170px;border:1px solid var(--gray-200);border-radius:7px;padding:6px 8px;outline:none;font:12px var(--font-ui);color:var(--gray-900);}
#rwa-selection-cmd:focus,#rwa-selection-link-input:focus{border-color:var(--gray-400);}
#rwa-selection-link-input{width:160px;}
#rwa-selection-bar input[hidden]{display:none!important;}
#rwa-selection-bar .rwa-color-a{border-bottom:3px solid #dc2626;line-height:1;padding-bottom:1px;font-weight:700;}
#rwa-selection-color-pop{position:absolute;top:40px;left:8px;display:flex;gap:5px;padding:7px;background:var(--white);border:1px solid var(--gray-200);border-radius:9px;box-shadow:0 8px 24px rgba(0,0,0,0.12);z-index:71;}
#rwa-selection-color-pop[hidden]{display:none;}
#rwa-selection-color-pop .rwa-sw{width:18px;height:18px;border:1px solid rgba(0,0,0,0.14);border-radius:50%;cursor:pointer;padding:0;transition:transform .1s;}

/* Boot reconciliation (docs/plans/2026-08-04-boot-reconciliation-design.md §3.5):
   a PERSISTENT bar, not a toast — stays until Keep/Use resolves it. */
#rwa-reconcile-bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--yellow);color:var(--gray-900);font-family:var(--font-ui);font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
#rwa-reconcile-bar[hidden]{display:none;}
#rwa-reconcile-bar button{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--gray-900);border-radius:6px;background:var(--white);color:var(--gray-900);cursor:pointer;}
#rwa-reconcile-bar button:hover{background:var(--gray-100);}
/* Issue #5 — a PERSISTENT bar (not a toast) offering the agent-script
   capability switch after replace_document is refused for script_introduction_denied. */
#rwa-scripts-bar{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 16px;background:var(--yellow);color:var(--gray-900);font-family:var(--font-ui);font-size:13px;box-shadow:0 2px 8px rgba(0,0,0,0.08);}

#rwa-overwrite-bar button:hover,#rwa-foreign-bar button:hover{background:var(--gray-100);}
#rwa-scripts-bar button{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--gray-900);border-radius:6px;background:var(--white);color:var(--gray-900);cursor:pointer;}
#rwa-scripts-bar button:hover{background:var(--gray-100);}
.rwa-frag-pulse{animation:rwa-frag-pulse 1.6s ease-out;}

[data-rwa-anchored]{outline:2px solid var(--gray-900);outline-offset:2px;border-radius:4px;}
.rwa-editable-leaf{cursor:text;border-radius:4px;transition:background .12s ease,box-shadow .12s ease,outline-color .12s ease;}
.rwa-editable-leaf:hover{background:rgba(59,130,246,0.045);box-shadow:0 0 0 3px rgba(59,130,246,0.08);}
.rwa-editable-leaf:focus-visible{outline:2px solid rgba(59,130,246,0.5);outline-offset:2px;}
.rwa-editable-leaf[contenteditable="true"]{background:rgba(59,130,246,0.07);box-shadow:0 0 0 2px rgba(59,130,246,0.22);outline:none;caret-color:var(--blue);}
/* Inline prompt mode — a "/" at a word boundary addresses the model. ONLY the "/command" suffix
   turns the accent colour (the data-rwa-cmd-text span), so the content before it stays normal
   (Notion-style); the block also gets a faint tint + inset accent bar as a secondary cue. Colour/
   tint/shadow only — no border/padding (would shift layout/move the caret) and no ::before glyph
   (Chromium caret jumps). */
[data-rwa-cmd="on"]{background:rgba(59,130,246,0.06);box-shadow:inset 2px 0 0 var(--blue);border-radius:4px;}
[data-rwa-cmd-text]{color:var(--blue);}
.rwa-locked{position:relative;background:rgba(239,68,68,0.04);border-left:3px solid var(--red);padding-left:8px;}
.rwa-locked::before{content:'\1F512';position:absolute;top:4px;right:8px;font-size:12px;opacity:.6;}
/* === DOCUMENT-PRODUCT DEFAULT: baseline content typography === */
/* Baseline content typography — applies to anything rendered inside the doc
   mount. Wrapped in :where() so specificity is 0,0,0,0; any <style> declared
   inside INLINE_DOC (the hello variant, the spec doc, imports that ship their
   own styles) always wins. This gives md/csv/docx/pdf imports and agent-written
   content a clean default look without the doc having to opt in.
   Region scope: doc-product default; see docs/specs/rwa-product-types.md. */
:where(#rwa-doc-mount){font-family:var(--font-ui);color:var(--gray-900);line-height:1.65;}
:where(#rwa-doc-mount) article{max-width:720px;margin:64px auto;padding:0 32px;}
:where(#rwa-doc-mount) h1{font-size:2.25rem;font-weight:600;letter-spacing:-.02em;line-height:1.2;margin:1.8em 0 .5em;color:var(--gray-900);}
:where(#rwa-doc-mount) article > h1:first-child{margin-top:0;}
:where(#rwa-doc-mount) h2{font-size:1.6rem;font-weight:600;letter-spacing:-.015em;line-height:1.25;margin:1.8em 0 .5em;color:var(--gray-900);}
:where(#rwa-doc-mount) h3{font-size:1.25rem;font-weight:600;line-height:1.3;margin:1.6em 0 .4em;color:var(--gray-900);}
:where(#rwa-doc-mount) h4{font-size:1.05rem;font-weight:600;line-height:1.4;margin:1.4em 0 .4em;color:var(--gray-900);}
:where(#rwa-doc-mount) h5,:where(#rwa-doc-mount) h6{font-size:1rem;font-weight:600;margin:1.2em 0 .3em;color:var(--gray-700);}
:where(#rwa-doc-mount) p{font-size:1rem;margin:0 0 1em;color:var(--gray-800);}
:where(#rwa-doc-mount) ul,:where(#rwa-doc-mount) ol{margin:0 0 1em;padding-left:1.5em;color:var(--gray-800);}
:where(#rwa-doc-mount) li{margin:.2em 0;}
:where(#rwa-doc-mount) li > p{margin:.2em 0;}
:where(#rwa-doc-mount) blockquote{margin:1em 0;padding:.25em 0 .25em 1em;border-left:3px solid var(--gray-300);color:var(--gray-600);font-style:italic;}
:where(#rwa-doc-mount) hr{border:0;border-top:1px solid var(--gray-200);margin:2em 0;}
:where(#rwa-doc-mount) a{color:var(--blue);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;}
:where(#rwa-doc-mount) a:hover{text-decoration-thickness:2px;}
:where(#rwa-doc-mount) code{font-family:var(--font-mono);font-size:.92em;background:var(--gray-100);padding:.1em .35em;border-radius:4px;color:var(--gray-800);}
:where(#rwa-doc-mount) pre{font-family:var(--font-mono);font-size:.9rem;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:14px 16px;overflow-x:auto;margin:0 0 1em;line-height:1.5;}
:where(#rwa-doc-mount) pre code{background:transparent;padding:0;border-radius:0;font-size:inherit;}
:where(#rwa-doc-mount) img{max-width:100%;height:auto;border-radius:6px;}
:where(#rwa-doc-mount) figure{margin:1.5em 0;}
:where(#rwa-doc-mount) figcaption{font-size:.875em;color:var(--gray-500);margin-top:.5em;text-align:center;}
:where(#rwa-doc-mount) table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.95em;}
:where(#rwa-doc-mount) th,:where(#rwa-doc-mount) td{border-bottom:1px solid var(--gray-200);padding:.5em .75em;text-align:left;vertical-align:top;}
:where(#rwa-doc-mount) th{font-weight:600;color:var(--gray-700);background:var(--gray-50);}
:where(#rwa-doc-mount) kbd{font-family:var(--font-mono);font-size:.85em;background:var(--gray-100);border:1px solid var(--gray-200);border-radius:4px;padding:.1em .4em;color:var(--gray-700);}
/* === END DOCUMENT-PRODUCT DEFAULT: baseline content typography === */
/* Print: hide runtime chrome, let @page own the margins, and protect block
   integrity (don't strand headings, split tables, etc.). The article padding
   is collapsed because @page already owns the paper margin.
   Long unbroken strings (URLs, hashes, file paths, German compounds) get
   overflow-wrap:break-word so they break at the right margin instead of
   clipping. Body text uses break-word (gentle: only breaks when overflow
   would happen, preserves column widths in narrow tables); <pre> uses
   anywhere (aggressive: code lines must wrap somewhere or data is lost,
   and a code block has no narrow-column concern). The print CSS swaps
   pre's screen overflow-x:auto for white-space:pre-wrap — there's no
   scrollbar on paper.
   <blockquote> intentionally lacks break-inside:avoid: blockquotes are
   flowable containers (often hold paragraphs / lists / tables) and forcing
   them intact strands page 1 with content on page 2. Inner paragraphs
   still get widows/orphans:3 protection. */
/* presentation render mode (spec §5.10) — screen only; print resets below.
   Inert for non-presentation containers: .viewmode-presentation is only ever
   added to #rwa-doc-mount when the presentation view is active, and the chrome
   ids only exist when PRODUCT_KIND==='presentation'. */
@media screen{
  #rwa-doc-mount.viewmode-presentation article{max-width:none;margin:0;padding:0;}
  #rwa-doc-mount.viewmode-presentation .rwa-slide{
    display:none;min-height:78vh;max-width:860px;margin:24px auto;padding:48px 56px;
    background:var(--white);border:1px solid var(--gray-200);border-radius:18px;
    box-shadow:0 1px 3px rgba(0,0,0,.04);
  }
  #rwa-doc-mount.viewmode-presentation .rwa-slide.active{display:block;}
  #rwa-view-chrome{display:none;gap:6px;align-items:center;}
  #rwa-view-chrome.active{display:inline-flex;}
  #rwa-view-chrome .count{font-family:var(--font-mono);font-size:11px;color:var(--gray-500);min-width:42px;text-align:center;}
}
/* Print vocabulary (2026-08-26): four author/agent-facing utility classes the
   system prompt teaches, so "start a new page before the appendix" through the
   / gesture compiles to markup instead of being impossible. Conventional names
   (no-print/print-only are the web's de-facto idiom) so imported HTML that
   already uses them just works. Screen half here; print half in @media print
   below. NOT position:fixed running headers — Chrome's print engine repeats
   fixed elements but places them flipped and overlapping content (probed
   2026-08-26); per-page furniture belongs to the browser's print dialog. */
:where(#rwa-doc-mount) .print-only{display:none;}
@page{margin:18mm;}
@media print{
  #rwa-runtime{display:none!important;}
  /* releaseAnchor() reparents #rwa-lens to <body> (see runtime), escaping the
     transitive hide above — hide it explicitly so it never prints. */
  #rwa-lens{display:none!important;}
  /* Same escape, same fix: the divergence bars are appended to <body>, not to
     #rwa-runtime, so the hide above never reached them and a yellow "this file
     changed" banner printed across the top of page 1. Pre-existing for the
     reconcile/overwrite bars; found while adding the third (#20) and fixed for
     all of them rather than shipping a fourth element with the same flaw. */
  #rwa-reconcile-bar,#rwa-overwrite-bar,#rwa-foreign-bar{display:none!important;}
  body{background:#fff!important;color:#000!important;min-height:0!important;padding-bottom:0!important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  #rwa-doc-mount{margin:0!important;padding:0!important;}
  /* The card becomes the page: the root <article> is a screen-layout container
     (card on a gray desk), so its card chrome must not print. margin/padding/
     max-width were always reset; box-shadow and border joined 2026-08-11 — with
     print-color-adjust:exact both print as a hard hairline FRAME around the
     content, continuing across every page break (reported live). A border on
     the ROOT article is card chrome by this policy — its padding is already
     force-removed, so a deliberate decorative frame there could never print
     acceptably anyway. Borders/fills on elements INSIDE the article are
     content and stay untouched. */
  :where(#rwa-doc-mount) article{margin:0 auto!important;padding:0!important;max-width:none!important;box-shadow:none!important;border:none!important;border-radius:0!important;}
  /* Same policy for a root-level WRAPPER (<div>/<main>/<section>): imported and
     AI-drafted docs often build the card as a padded div instead of an
     <article>, and its screen padding/max-width printed as a huge dead border
     inside the @page margin (reported live 2026-08-26: 56px padding + 640px
     column ≈ 33mm extra margin around ~10.5pt text). Root-level children only —
     boxes INSIDE the wrapper are content and stay untouched. The root
     container's font-size is also pinned to the 12pt print baseline (16px ≡
     12pt, so the seed default is byte-identical on paper); inner elements with
     explicit sizes keep them. */
  :where(#rwa-doc-mount)>div,:where(#rwa-doc-mount)>main,:where(#rwa-doc-mount)>section{margin:0 auto!important;padding:0!important;max-width:none!important;box-shadow:none!important;border:none!important;border-radius:0!important;}
  :where(#rwa-doc-mount)>article,:where(#rwa-doc-mount)>div,:where(#rwa-doc-mount)>main,:where(#rwa-doc-mount)>section{font-size:12pt!important;}
  :where(#rwa-doc-mount) h1,:where(#rwa-doc-mount) h2,:where(#rwa-doc-mount) h3,:where(#rwa-doc-mount) h4,:where(#rwa-doc-mount) h5,:where(#rwa-doc-mount) h6{break-after:avoid;page-break-after:avoid;}
  :where(#rwa-doc-mount) figure,:where(#rwa-doc-mount) pre,:where(#rwa-doc-mount) table,:where(#rwa-doc-mount) img{break-inside:avoid;page-break-inside:avoid;}
  :where(#rwa-doc-mount) tr,:where(#rwa-doc-mount) li{break-inside:avoid;page-break-inside:avoid;}
  :where(#rwa-doc-mount) p{orphans:3;widows:3;}
  :where(#rwa-doc-mount) p,:where(#rwa-doc-mount) li,:where(#rwa-doc-mount) td,:where(#rwa-doc-mount) th,:where(#rwa-doc-mount) code,:where(#rwa-doc-mount) a{overflow-wrap:break-word;}
  :where(#rwa-doc-mount) pre{white-space:pre-wrap;overflow:visible;overflow-wrap:anywhere;}
  /* One over-wide element makes the print dialog's fit-to-width shrink the
     WHOLE page — measured 2026-08-26: a 2053px nowrap table on A4/18mm scales
     everything to 0.32× ≈ 3.8pt body text. There is no horizontal scroll on
     paper, so nowrap cells must wrap and wide media must cap. Cells get
     overflow-wrap:anywhere (overriding the gentler break-word above): only
     `anywhere` lowers a cell's min-content width, and without that a column of
     unbreakable tokens (URLs, IDs, hashes) keeps its full width no matter what
     — same lost-data-vs-column-width trade <pre> already makes. height:auto
     keeps an attribute-sized <img>'s aspect ratio once max-width bites. */
  :where(#rwa-doc-mount) td,:where(#rwa-doc-mount) th{white-space:normal!important;overflow-wrap:anywhere;}
  :where(#rwa-doc-mount) table{max-width:100%!important;}
  :where(#rwa-doc-mount) img{max-width:100%!important;height:auto!important;}
  /* Print vocabulary, print half (see the comment above @page). display:revert
     restores the element's UA default (div→block, span→inline, tr→table-row)
     rather than forcing block on everything. */
  :where(#rwa-doc-mount) .no-print{display:none!important;}
  :where(#rwa-doc-mount) .print-only{display:revert!important;}
  :where(#rwa-doc-mount) .print-break{break-before:page!important;page-break-before:always!important;}
  :where(#rwa-doc-mount) .print-keep{break-inside:avoid!important;page-break-inside:avoid!important;}
  :where(#rwa-doc-mount) a{color:#000!important;}
  /* presentation (spec §5.10): print the deck as a linear document — reset the
     slide framing and hide the nav chrome. Inert unless presenting. */
  #rwa-view-chrome{display:none!important;}
  #rwa-doc-mount.viewmode-presentation article{max-width:720px;margin:0 auto!important;padding:0!important;}
  #rwa-doc-mount.viewmode-presentation .rwa-slide{all:unset;display:block;break-inside:avoid;margin:0 0 18px;}
}

<h1>Intelligence — &ldquo;print-aware&rdquo;</h1>
<p class="lede">A droppable <strong>intelligence</strong> (intelligence/0.2): a signed <code>rwa-agent/1</code> role you can drop onto another rewritable to retune its &#8984;K editor. This file is the carrier — open it, read it, drop it.</p>
<h2>What it does</h2>
<p>You are a print-aware editor. Documents you edit are meant to be read on paper as well as screen, so every change you make must survive printing.

Use the four print utility classes the runtime provides, and only those: class="print-break" starts a new page before an element; class="print-keep" holds a block together on one page; class="no-print" hides something on paper; class="print-only" shows something only on paper. Reach for print-break when the user asks for a section to start a new page, and print-keep for a table, figure or code block that must not split.

Put repeating table headers in a &lt;thead&gt; — browsers repeat it on every printed page. Never simulate a running header or footer with position:fixed: print engines repeat fixed elements flipped and overlapping the content.

Keep content inside the printable width. Avoid white-space:nowrap on table cells and avoid fixed pixel widths wider than a text column: one over-wide element makes the whole sheet shrink to fit, which is how a document ends up printed at unreadable size. Prefer wrapping text to horizontal scrolling in every case, because paper has no scrollbar.</p>
<h2>What it carries</h2>
<ul>
<li><strong>Role:</strong> <code>print-aware</code></li>
<li><strong>Affinity:</strong> document, presentation (advisory — a mismatch only warns).</li>
<li><strong>Vault namespaces:</strong> none.</li>

<h2>How to use it</h2>
<p>Drop this file onto another rewritable to install the role (behind the consent dialog), then activate it from the &ldquo;AI&rdquo; chip in the status bar. This carrier is itself a skill-host, so the role is already installed here — try it directly.</p>
</article>

// === END PRODUCT: INLINE_DOC stub ===

// === DOCUMENT-PRODUCT DEFAULT: ANCHORABLE_TAGS ===
// Prose-block anchoring vocabulary. Drives lens click-to-anchor and
// data-rwa-id backfill. Region scope: doc-product default; see
// docs/specs/rwa-product-types.md.
// Spec 0.11: TABLE and TD added so the workflow product's parallel

const ANCHORABLE_TAGS = new Set(['P','H1','H2','H3','H4','H5','H6','BLOCKQUOTE','LI','FIGURE','PRE','ASIDE','TABLE','TD']);
window.ANCHORABLE_TAGS = ANCHORABLE_TAGS; // expose for tests

// ─── Storage ────────────────────────────────────────────────────────
const RWA = {
  DB:'rwa_'+DOC_UUID, KEY:'self',
  DOC:'rwa_doc', UNDO:'rwa_undo', HIST:'rwa_hist', FSA:'rwa_fsa', STATE:'rwa_state', VAULT:'rwa_vault', SOURCES:'rwa_sources', HOOK_LOG:'rwa_hook_log',
  UNDO_CAP:10, HIST_CAP:1000, NUDGE_THRESHOLD:5,
  VAULT_IDLE_MS: 15 * 60 * 1000, // auto-lock the vault after this long with no vault operation
  K_API:'rwa_apikey', K_MODEL:'rwa_model', K_BACKEND:'rwa_backend',
  // "Remember key on this device" preference (not the key — a boolean). See
  // the persistApiKey block below.
  K_REMEMBER:'rwa_remember_key',
  // Per-backend base-URL overrides for local OpenAI-compatible servers.
  // Empty/unset falls back to DEFAULT_*_URL below.
  K_BASE_URL_OLLAMA:'rwa_base_url_ollama', K_BASE_URL_LMSTUDIO:'rwa_base_url_lmstudio',
  // Bridge SESSION backend (persistent claude via web_cli_bridge /session/*).
  // Unlike single-shot /run, /session/* is token-mandatory + origin-allowlisted,
  // and create() needs a server-side working dir for the claude session.
  K_BRIDGE_TOKEN:'rwa_bridge_token', K_BRIDGE_CWD:'rwa_bridge_cwd',
  // Optional model pin for the single-shot bridge (`claude -p --model …`).
  // Empty = the CLI's own default, which drifts with CLI updates.
  K_BRIDGE_MODEL:'rwa_bridge_model',
  MODEL:'google/gemini-3.5-flash',
  FILE:'print-aware.intelligence.html',
  // OpenAI-compat localhost defaults — both Ollama and LM Studio ship the
  // `/v1/chat/completions` shape and reuse the same multi-turn tool-use loop
  // as OpenRouter. The only differences are the base URL and the absence of
  // an Authorization header. CORS must be enabled on the local server:
  //   Ollama:   `OLLAMA_ORIGINS=*` (or specific origin) before `ollama serve`
  //   LMStudio: Developer panel → "Enable CORS" toggle
  // Browsers treat http://localhost as a Secure Context so mixed-content does
  // not block these requests even when the container is served over HTTPS.
  DEFAULT_OLLAMA_URL:'http://localhost:11434/v1',
  DEFAULT_LMSTUDIO_URL:'http://localhost:1234/v1',
  // atomic.chat: a local OpenAI-compatible inference server (MLX-backed on
  // Apple Silicon) with the same /v1/chat/completions + /v1/models shape and
  // real multi-turn tool_calls. CORS note: it allows http(s) page origins out
  // of the box but NOT the file:// null origin — serve the container from a
  // local origin (or a hosted projection) to use it.
  DEFAULT_ATOMIC_URL:'http://127.0.0.1:1337/v1',
  K_BASE_URL_ATOMIC:'rwa_base_url_atomic',
  // Optional alternative agent backend: a localhost CLI bridge
  // (https://github.com/martintreiber/web_cli_bridge style) that runs
  // arbitrary shell commands. When the user picks "bridge" in settings, ⌘K
  // shells out to `claude -p` instead of calling OpenRouter directly. Free
  // for users with a Claude subscription; the price is a per-call subprocess
  // (~5-10s startup) and a single-shot agent loop (no mid-stream tool_calls).
  BRIDGE_URL:'http://127.0.0.1:8765/run',

};

// ─── API key persistence — "Remember on this device", all documents ────────
// The key lives in sessionStorage (per tab) by contract. When "Remember" is on
// (the default), it is ALSO mirrored to localStorage, which at file:// is shared
// across every local rewritable (the null origin) and per-origin when hosted —
// so the key is entered once and every document reuses it, no re-paste. This is
// a deliberate posture choice for the target audience: a non-technical user for
// whom re-entry is the entire friction (operator decision 2026-08-12). The
// accepted cost, recorded in docs/received-container-threat-model-2026-08-04.md:
// a MALICIOUS rewritable opened from an untrusted source could read a remembered
// key from shared file:// storage. The toggle (⚙ → OpenRouter) turns it off,
// clearing the stored copy and restoring the strict per-tab posture.
function rememberKeyOn() {
  try { return (localStorage.getItem(RWA.K_REMEMBER) || 'on') !== 'off'; } catch (_) { return false; }
}
function setRememberKey(on) {
  try {
    localStorage.setItem(RWA.K_REMEMBER, on ? 'on' : 'off');
    if (on) { const k = sessionStorage.getItem(RWA.K_API); if (k) localStorage.setItem(RWA.K_API, k); }
    else localStorage.removeItem(RWA.K_API);
  } catch (_) {}
}
// Single write path for a USER-ENTERED key: always the per-tab store, plus the
// remembered store when the toggle is on. (The ?key= URL channel below stays
// sessionStorage-only on purpose — it is the explicitly-ephemeral path.)
function persistApiKey(v) {
  const key = (v == null ? '' : String(v)).trim();
  sessionStorage.setItem(RWA.K_API, key);
  try {
    if (rememberKeyOn() && key) localStorage.setItem(RWA.K_API, key);
    else localStorage.removeItem(RWA.K_API);
  } catch (_) {}
}
// Boot hydration: seed the per-tab key from the remembered one, so every read
// site (all of which read sessionStorage) works unchanged and every tab/document
// starts connected. Runs before the ⌘K path and the no-key connect prompt; a
// ?key= URL param below still wins (explicit intent). localStorage can throw in
// locked-down privacy modes — tolerate and fall back to per-tab entry.
try {
  if (!sessionStorage.getItem(RWA.K_API) && rememberKeyOn()) {
    const remembered = localStorage.getItem(RWA.K_API);
    if (remembered) sessionStorage.setItem(RWA.K_API, remembered);
  }
} catch (_) {}

// `rwa new -o` / `rwa import -o` can pass first-paint configuration via URL
// params so the user doesn't have to open ⚙ before pressing ⌘K. Supported:
//   ?key=…       → sessionStorage rwa_apikey   (OpenRouter API key)
//   ?backend=…   → sessionStorage rwa_backend  (openrouter|ollama|lmstudio|bridge)
//   ?model=…     → sessionStorage rwa_model    (model name string)
// Each lifted param is removed from the URL via history.replaceState so the
// key (and any later bookmark/share of the URL) does not retain the value.
try {
  const qs = new URLSearchParams(location.search);
  const k = qs.get('key');
  if (k) {
    sessionStorage.setItem(RWA.K_API, k);
    qs.delete('key');
  }
  const b = qs.get('backend');
  if (b && ['openrouter','ollama','lmstudio','atomic','bridge','bridge-session'].includes(b)) {
    sessionStorage.setItem(RWA.K_BACKEND, b);
    qs.delete('backend');
  }
  const md = qs.get('model');
  if (md) {
    sessionStorage.setItem(RWA.K_MODEL, md);
    qs.delete('model');
  }
  if (k || b || md) {
    const tail = qs.toString();
    history.replaceState(null, '', location.pathname + (tail ? '?' + tail : '') + location.hash);
  }
} catch (_) { /* sandboxed contexts can throw on history.replaceState */ }

// LF canonicalization: doc text is stored, validated, and committed LF-only.
// Canonical text form = LF-only + Unicode NFC. NFC because apply_edits matches
// by exact splice: an NFC `find` against NFD document bytes (paste artifacts)
// fails on visually identical text. Doc, find and replace all pass through
// here, so matching never sees a non-canonical form. 8 mirrored copies —
// docs/plans/2026-08-10-nfc-anchor-normalization-design.md lists them.
const canonLF = s => s == null ? '' : String(s).replace(/\r\n/g, '\n').replace(/\r/g, '\n').normalize('NFC');

let _db;
const REQUIRED_STORES = [RWA.DOC, RWA.UNDO, RWA.HIST, RWA.FSA, RWA.STATE, RWA.VAULT, RWA.SOURCES, RWA.HOOK_LOG];
// User-declared store registry. Persisted to RWA.STATE so declarations survive
// reload. The openDB() upgrade handler creates declared stores on every bump.
// Populated at bootstrap via loadUserStoreDecls(); mutated by runtime.db.open.
const userStoreDecls = new Map();  // name -> { autoIncrement?: boolean }
let _dbVersionBumpInFlight = null; // Promise<void> while a bump is queued
async function openDB() {
  if (_db) return _db;
  // Step 1: probe without a version to learn the current DB version. On first
  // open this creates an empty v1 DB; subsequent opens see whatever the prior
  // session left behind. We use this number to compute the next upgrade target.
  const probe = await new Promise((res, rej) => {
    const r = indexedDB.open(RWA.DB);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('db open blocked by another tab'));
  });
  // We expect every required store to use out-of-line keys (keyPath === null).
  // If a store is missing — or exists with the wrong schema (in-line keys from
  // an old prototype) — we need to (re)create it. The schema-recreate path is
  // load-bearing for users coming from rwa-edit prototypes that stored docs
  // with `keyPath: 'k'`; dropping it would brick their containers.
  const toRecreate = [];
  for (const name of REQUIRED_STORES) {
    if (!probe.objectStoreNames.contains(name)) { toRecreate.push(name); continue; }
    const store = probe.transaction(name, 'readonly').objectStore(name);
    if (store.keyPath !== null) toRecreate.push(name);
  }
  // Also bump if any declared user-store is missing from the live schema —
  // this is how Task 2's runtime.db.open triggers a version bump and how a
  // reload re-instantiates declared stores from persisted user_stores.
  const missingUserStores = [...userStoreDecls.keys()].filter(s => !probe.objectStoreNames.contains(s));
  if (toRecreate.length === 0 && missingUserStores.length === 0) { _db = probe; return _db; }
  const newVersion = probe.version + 1;
  probe.close();
  _db = await new Promise((res, rej) => {
    const r = indexedDB.open(RWA.DB, newVersion);
    r.onupgradeneeded = e => {
      const db = e.target.result;
      // Required-store schema-recreate (legacy in-line-key migration + first-open).
      toRecreate.forEach(name => {
        if (db.objectStoreNames.contains(name)) db.deleteObjectStore(name);
        db.createObjectStore(name); // out-of-line keys
      });
      // User-declared stores: create whatever isn't already present. We never
      // delete user stores here — declarations are additive across sessions.
      for (const [name, opts] of userStoreDecls) {
        if (!db.objectStoreNames.contains(name)) {
          db.createObjectStore(name, opts && opts.autoIncrement ? { autoIncrement: true } : undefined);
        }
      }
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
    r.onblocked = () => rej(new Error('db upgrade blocked by another tab'));
  });
  return _db;
}
// Resolve on tx.oncomplete, not the request's onsuccess: a put/delete REQUEST
// can succeed while the TRANSACTION still aborts at commit (quota, FS error),
// rolling the write back — resolving on request success would report a durable
// write that never landed. Same tx-commit discipline popUndo/commitDoc use.
const idbGet = (s, k = RWA.KEY) => openDB().then(db => new Promise((res, rej) => {
  const tx = db.transaction(s);
  const r = tx.objectStore(s).get(k);
  let v;
  r.onsuccess = () => { v = r.result; };
  tx.oncomplete = () => res(v);
  tx.onerror = () => rej(tx.error || r.error);
  tx.onabort = () => rej(tx.error || new Error('idbGet tx aborted'));
}));
const idbPut = (s, v, k = RWA.KEY) => openDB().then(db => new Promise((res, rej) => {
  const tx = db.transaction(s, 'readwrite');
  tx.objectStore(s).put(v, k);
  tx.oncomplete = () => res();
  tx.onerror = () => rej(tx.error);
  tx.onabort = () => rej(tx.error || new Error('idbPut tx aborted'));
}));
const idbDel = (s, k = RWA.KEY) => openDB().then(db => new Promise((res, rej) => {
  const tx = db.transaction(s, 'readwrite');
  tx.objectStore(s).delete(k);
  tx.oncomplete = () => res();
  tx.onerror = () => rej(tx.error);
  tx.onabort = () => rej(tx.error || new Error('idbDel tx aborted'));
}));

// === Public runtime API (spec §7) ===========================================
// Exposed on window.runtime once the bootstrap IIFE successfully passes
// private-mode detection and openDB(). Documents read/write their own
// structured data through runtime.db.*, blobs through runtime.fs.*, drive the
// modify loop via runtime.modify/commit/undo, and observe state via
// runtime.status + runtime.on.
//
// Reserved-name enforcement: any store name matching ^rwa_ is rejected with
// RwaReservedError. The runtime owns rwa_doc/rwa_undo/rwa_hist/rwa_fsa/
// rwa_state and any future rwa_* (spec §5.3).

class RwaReservedError extends Error {
  constructor(name) { super(`store name '${name}' is reserved (rwa_* is runtime-only)`); this.name = 'RwaReservedError'; }
}

function assertRuntimeDbStore(name) {
  if (typeof name !== 'string' || !name) throw new TypeError('store name must be a non-empty string');
  if (/^rwa_/.test(name)) throw new RwaReservedError(name);
}

// Producer-side BroadcastChannel cache. Each store has one writer channel that
// runtime.db.{put,del} reuse to fan out events to subscribers. Subscribers
// open their OWN channel on the same name (see runtimeDbSubscribe) because
// BroadcastChannel does not deliver a message back to the channel that posted
// it (per spec: "Messages are received by all channels of the same name, in
// the same agent cluster, except the source channel"). Channel name is
// 'rwa_<DOC_UUID>:<store>' — namespaced to the container so cross-container
// noise is impossible even if two rwa files share an origin.
const runtimeDbChannels = new Map();   // store -> BroadcastChannel
function getStoreChannel(store) {
  let ch = runtimeDbChannels.get(store);
  if (!ch) {
    ch = new BroadcastChannel('rwa_' + DOC_UUID + ':' + store);
    runtimeDbChannels.set(store, ch);
  }
  return ch;
}

async function runtimeDbGet(store, key) {
  assertRuntimeDbStore(store);
  return idbGet(store, key);
}
async function runtimeDbPut(store, key, value) {
  assertRuntimeDbStore(store);
  const decl = userStoreDecls.get(store);
  // For autoIncrement stores, callers pass a null/undefined key — IDB assigns
  // a monotonic integer. We route around idbPut() because that helper always
  // forwards the (possibly null) key to objectStore.put(value, key), which IDB
  // rejects with DataError when keyPath is null AND no out-of-line key is given.
  let resolvedKey;
  if ((key === null || key === undefined) && decl?.autoIncrement) {
    const db = await openDB();
    resolvedKey = await new Promise((res, rej) => {
      const tx = db.transaction(store, 'readwrite');
      const req = tx.objectStore(store).put(value);
      req.onsuccess = () => res(req.result);
      req.onerror   = () => rej(req.error);
    });
  } else {
    // Non-autoIncrement stores require an explicit key. Without this guard the
    // call falls through to idbPut(store, value, null), which surfaces an opaque
    // DataError from IDB; flag the API misuse up front so callers know to either
    // pass a key or declare the store with {autoIncrement: true}.
    if (key === null || key === undefined) {
      throw new TypeError(`runtime.db.put: key is required for non-autoIncrement store '${store}' (declare with {autoIncrement: true} to omit keys)`);
    }
    await idbPut(store, value, key);   // internal idbPut keeps (store, value, key) order
    resolvedKey = key;
  }
  // Fan out AFTER the IDB write resolves so subscribers never observe a key
  // that the store didn't actually commit. The resolved key matters for
  // autoIncrement stores — subscribers shouldn't have to guess what IDB picked.
  getStoreChannel(store).postMessage({ kind: 'put', key: resolvedKey });
  return resolvedKey;
}
async function runtimeDbDel(store, key) {
  assertRuntimeDbStore(store);
  await idbDel(store, key);
  getStoreChannel(store).postMessage({ kind: 'del', key });
}

function runtimeDbSubscribe(store, callback) {
  assertRuntimeDbStore(store);
  if (typeof callback !== 'function') throw new TypeError('callback must be a function');
  // Open a fresh channel rather than reusing the producer's: a BroadcastChannel
  // does not receive its own postMessage, so listening on the cached writer
  // would silently swallow every local event. Same-name channels in the same
  // agent cluster DO see each other, so this still works in-tab + cross-tab.
  const ch = new BroadcastChannel('rwa_' + DOC_UUID + ':' + store);
  const handler = (msg) => { try { callback(msg.data); } catch (_) { /* never let a buggy doc-side callback break the runtime */ } };
  ch.addEventListener('message', handler);
  return () => { ch.removeEventListener('message', handler); ch.close(); };
}
async function runtimeDbAll(store) {
  assertRuntimeDbStore(store);
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const os = tx.objectStore(store);
    const out = [];
    const req = os.openCursor();
    req.onsuccess = () => {
      const cur = req.result;
      if (!cur) return res(out);
      out.push({ key: cur.key, value: cur.value });
      cur.continue();
    };
    req.onerror = () => rej(req.error);
  });
}

// User-store declarations are persisted under rwa_state['user_stores'] so a
// reload re-instantiates them via openDB()'s upgrade path. The shape is
// { [name]: { autoIncrement?: boolean } } — must round-trip through structured
// clone, so plain JSON-shaped objects only.
async function loadUserStoreDecls() {
  const stored = await idbGet(RWA.STATE, 'user_stores');
  if (stored && typeof stored === 'object') {
    for (const [name, opts] of Object.entries(stored)) userStoreDecls.set(name, opts || {});
  }
}
async function persistUserStoreDecls() {
  const out = {};
  for (const [name, opts] of userStoreDecls) out[name] = opts;
  await idbPut(RWA.STATE, out, 'user_stores');
}

// Serialize concurrent runtime.db.open calls: each one needs to close + reopen
// the connection, and IDB version-bumps can't overlap. The in-flight promise
// fans out, queues the next bump, then drops the latch.
async function bumpVersionAndCreateStore(name, opts) {
  if (_dbVersionBumpInFlight) await _dbVersionBumpInFlight;
  _dbVersionBumpInFlight = (async () => {
    if (_db) { _db.close(); _db = null; }
    userStoreDecls.set(name, opts || {});
    await openDB();
    await persistUserStoreDecls();
  })();
  try { await _dbVersionBumpInFlight; } finally { _dbVersionBumpInFlight = null; }
}

async function runtimeDbOpen(name, opts = {}) {
  assertRuntimeDbStore(name);
  const db = await openDB();
  // Idempotent on schema match: an already-present store is a no-op when the
  // caller's opts agree with the live schema. We never re-create a store under
  // the same name — that would silently drop user data — and we reject opts
  // that contradict the live schema so authors aren't surprised by invisible
  // drift (e.g. db.put(name, null, …) misfiring on a non-autoIncrement store
  // the registry mistakenly thinks is autoIncrement).
  if (db.objectStoreNames.contains(name)) {
    const tx = db.transaction(name, 'readonly');
    const liveAutoInc = !!tx.objectStore(name).autoIncrement;
    tx.abort?.();   // explicit hygiene; readonly tx would auto-close anyway
    const wantAutoInc = !!opts.autoIncrement;
    if (liveAutoInc !== wantAutoInc) {
      throw new Error(`runtime.db.open: store '${name}' already exists with autoIncrement=${liveAutoInc}, cannot change to ${wantAutoInc}. Pick a different name.`);
    }
    // Self-heal: registry may have drifted from a prior reload or a failed
    // persist; rewrite it from the authoritative live schema.
    const cur = userStoreDecls.get(name);
    if (!cur || !!cur.autoIncrement !== liveAutoInc) {
      userStoreDecls.set(name, { autoIncrement: liveAutoInc });
      await persistUserStoreDecls();
    }
    return;
  }
  await bumpVersionAndCreateStore(name, opts);
}

// === runtime.fs (OPFS-backed, per-container namespaced) =====================
// Spec §7: documents persist blobs via runtime.fs.{read,write,del,list}.
// Spec §5.7: each container's blobs live under `_<DOC_UUID>/` in the shared
// OPFS so two containers in the same origin can't shadow each other's paths
// even though OPFS is null-origin under file://.
//
// Documents see paths like "img/cat.png"; the runtime transparently rewrites
// them to "_<DOC_UUID>/img/cat.png" on the way in. The namespace prefix is
// reserved (the leading underscore + UUID is opaque to the doc) and the
// runtime rejects any user-supplied path that tries to address `_rwa/` or
// leading-slash absolutes — those would let a doc trample reserved
// runtime-only paths or escape the namespace.
const OPFS_NS = '_' + DOC_UUID + '/';

function assertUserFsPath(path) {
  if (typeof path !== 'string') throw new TypeError('path must be a string');
  // An empty path has no meaningful target — downstream behavior is undefined
  // (the stub silently writes to `prefix + 'undefined'`; real OPFS throws a
  // cryptic TypeError on the underlying getFileHandle('')). Reject early.
  if (path === '') throw new Error('path must be non-empty');
  // `_rwa/` is the reserved runtime path prefix (spec §5.3). Any user-supplied
  // path that starts with it is rejected up front — a doc that smuggled a blob
  // there could later collide with a future runtime-owned subtree.
  if (path.startsWith('_rwa/')) throw new Error("path '_rwa/' is reserved (runtime-only)");
  // OPFS doesn't have absolute paths; a leading slash usually means the author
  // confused this for a filesystem-rooted path. Reject so the mistake surfaces
  // at the call site instead of silently writing to a weird subdirectory.
  if (path.startsWith('/')) throw new Error("path must be relative (no leading slash)");
  // `.` / `..` segments aren't traversable in OPFS — real browsers throw a
  // TypeError on getDirectoryHandle('..') / getFileHandle('.'). Reject early
  // so the author sees a path-shaped error instead of an opaque DOM exception,
  // and so we never accidentally let a doc try to escape its own namespace.
  const segs = path.split('/');
  if (segs.some(s => s === '.' || s === '..')) {
    throw new Error("path segments '.' and '..' are not allowed");
  }
}

// Resolve the per-container OPFS root, creating it on first access. Throws a
// readable error on platforms that don't expose OPFS (older Safari, Firefox
// without the flag) so the doc can decide whether to degrade or surface to
// the user instead of seeing an opaque TypeError on `getDirectory`.
async function opfsRootForContainer() {
  if (!navigator.storage || !navigator.storage.getDirectory) {
    throw new Error('OPFS not supported in this environment');
  }
  let root;
  try {
    root = await navigator.storage.getDirectory();
  } catch (e) {
    // Chromium blocks OPFS under file:// origins with a SecurityError
    // ("certain files are unsafe for access within a Web application").
    // IDB works on file:// but OPFS does not — translate the cryptic native
    // error into something a document author can act on.
    if (e?.name === 'SecurityError') {
      throw new Error(
        "runtime.fs: OPFS is not available on file:// origins (Chromium policy). " +
        "Host this container via HTTP — e.g. `node service/server.js` then open " +
        "http://localhost:8080/ — or use runtime.db.* for storage."
      );
    }
    throw e;
  }
  // OPFS_NS ends in '/' to make string concatenation in the stub-side
  // bookkeeping unambiguous; the real OPFS API takes bare segment names, so
  // strip the trailing slash before handing it to getDirectoryHandle.
  return root.getDirectoryHandle(OPFS_NS.replace(/\/$/, ''), { create: true });
}

// Walk slash-separated `path` to the terminal file handle. `create` is
// threaded into every directory hop AND the final file hop, so callers
// distinguish "write/create" from "read/must-exist" with a single flag.
async function walkToFile(path, { create } = {}) {
  const parts = path.split('/').filter(Boolean);
  const name = parts.pop();
  let dir = await opfsRootForContainer();
  for (const p of parts) dir = await dir.getDirectoryHandle(p, { create });
  return dir.getFileHandle(name, { create });
}

async function runtimeFsWrite(path, blob) {
  assertUserFsPath(path);
  const handle = await walkToFile(path, { create: true });
  const writable = await handle.createWritable();
  // Mirror the FSA write pattern used elsewhere in the bootstrap: close in a
  // finally so a partial-write failure still flushes the writer (avoids
  // dangling write streams that some browsers refuse to GC).
  try { await writable.write(blob); } finally { await writable.close(); }
}

async function runtimeFsRead(path) {
  assertUserFsPath(path);
  let handle;
  try {
    handle = await walkToFile(path);
  } catch (e) {
    // Real OPFS throws a bare NotFoundError with no path context. Documents
    // that catch this can't tell which path failed without parsing the entire
    // call site, so we rewrap with the originating path — matches the
    // descriptive-error style used elsewhere on runtime.*.
    if (e?.name === 'NotFoundError') throw new Error("runtime.fs.read: no file at '" + path + "'");
    throw e;
  }
  return handle.getFile();
}

async function runtimeFsDel(path) {
  assertUserFsPath(path);
  const parts = path.split('/').filter(Boolean);
  const name = parts.pop();
  let dir = await opfsRootForContainer();
  try {
    for (const p of parts) dir = await dir.getDirectoryHandle(p);
    // `{ recursive: true }` lets del work on non-empty directories — real
    // browsers reject a plain removeEntry on a non-empty dir with
    // InvalidModificationError. Use recursive so the API is symmetric with
    // write (which silently creates any intermediate dirs).
    await dir.removeEntry(name, { recursive: true });
  } catch (e) {
    if (e?.name === 'NotFoundError') throw new Error("runtime.fs.del: no file at '" + path + "'");
    throw e;
  }
}

async function runtimeFsList(prefix) {
  // For list only, empty/undefined means "root of the container namespace" —
  // it's the natural way to enumerate blobs without knowing subdir names.
  // read/write/del keep the strict guard (they need a real path).
  if (prefix === undefined || prefix === '') prefix = '';
  else assertUserFsPath(prefix);
  const parts = prefix.split('/').filter(Boolean);
  let dir = await opfsRootForContainer();
  try {
    for (const p of parts) dir = await dir.getDirectoryHandle(p);
  } catch (e) {
    // A list against a never-written directory is not an error in document
    // land — most authors will call list() defensively to discover what
    // exists. Return [] for NotFoundError only; any other failure (a
    // TypeError on an invalid name, a SecurityError under iframe sandboxing)
    // is a real problem the doc should see, so re-throw it.
    if (e?.name === 'NotFoundError') return [];
    throw e;
  }
  const out = [];
  for await (const [name, h] of dir.entries()) {
    out.push({ name, kind: h.kind });
  }
  return out;
}

// === Runtime event bus (spec §7) ============================================
// Minimal pub/sub for commit/modify/status. Callbacks are scoped per event
// name; an event name not in this whitelist throws on subscribe so a typo
// (or a future event a doc hopes already exists) fails loud at the wire-up
// site rather than silently never firing.
const runtimeEvents = {
  commit: new Set(),
  modify: new Set(),
  mode: new Set(),
  status: new Set(),
};

function runtimeOn(event, callback) {
  if (!Object.prototype.hasOwnProperty.call(runtimeEvents, event)) {
    throw new Error("unknown event '" + event + "' (use 'commit', 'modify', 'mode', or 'status')");
  }
  if (typeof callback !== 'function') throw new TypeError('callback must be a function');
  runtimeEvents[event].add(callback);
  return () => { runtimeEvents[event].delete(callback); };
}

// Invoke every subscriber for `event`. Callback errors are caught so one buggy
// listener can't break delivery to the others, and so the synchronous emit
// inside e.g. setDirty(false) can never propagate an exception into the
// commit() / modify() success path (which would surface as a fake failure).
function emitRuntimeEvent(event, payload) {
  // Snapshot the Set before iterating: a listener subscribing or unsubscribing
  // during this emit must not perturb the current round (conventional pubsub
  // semantics — subscribed-during-emit ⇒ skip until next emit).
  for (const cb of [...runtimeEvents[event]]) {
    try { cb(payload); } catch (_) { /* swallow user-cb errors */ }
  }
  // I8 (v0.9 §9) — fire installed hooks for the mapped lifecycle event. 'modify' (an edit commit,
  // carrying instruction/lensMeta) → on-commit; 'mode' → on-mode-change (with the previous mode).
  // Fire-and-forget: wrapped so a firing failure can never propagate into the commit/mode path.
  try {
    if (typeof fireHooks === 'function') {
      if (event === 'modify') fireHooks('on-commit', { event: 'on-commit', instruction: payload && payload.instruction, lensMeta: payload && payload.lensMeta });
      else if (event === 'mode') { const previous = _lastHookMode; _lastHookMode = payload && payload.mode; fireHooks('on-mode-change', { event: 'on-mode-change', mode: payload && payload.mode, previous }); }
    }
  } catch (_) { /* hook firing never breaks the emitter */ }
}

// === Cross-container bus (workspace-presence subset) ========================
// BroadcastChannel-backed pub/sub across same-origin rewritables. This is a
// deliberately small public surface: documents can publish/subscribe to normal
// topics, while runtime-reserved prefixes stay off-limits. The first concrete
// consumer is workspace autodiscovery on `workspace:presence`.
const runtimeBusChannels = new Map();

function assertRuntimeBusTopic(topic) {
  if (typeof topic !== 'string' || !topic) throw new TypeError('bus topic must be a non-empty string');
  if (topic.length > 128 || !/^[A-Za-z0-9][A-Za-z0-9:_./-]*$/.test(topic)) {
    throw new TypeError('bus topic contains unsupported characters');
  }
  if (/^(?:rwa[:_]|skills:)/.test(topic)) {
    throw new RwaReservedError(topic);
  }
}

function runtimeBusChannel(topic) {
  assertRuntimeBusTopic(topic);
  if (typeof BroadcastChannel === 'undefined') throw new Error('BroadcastChannel is not available');
  let ch = runtimeBusChannels.get(topic);
  if (!ch) {
    ch = new BroadcastChannel('rwa_bus:' + topic);
    if (typeof ch.unref === 'function') ch.unref();
    runtimeBusChannels.set(topic, ch);
  }
  return ch;
}

function runtimeBusPublish(topic, message) {
  const envelope = { topic, from: DOC_UUID, at: Date.now(), message };
  runtimeBusChannel(topic).postMessage(envelope);
  return envelope;
}

function runtimeBusSubscribe(topic, callback) {
  assertRuntimeBusTopic(topic);
  if (typeof callback !== 'function') throw new TypeError('callback must be a function');
  if (typeof BroadcastChannel === 'undefined') throw new Error('BroadcastChannel is not available');
  const ch = new BroadcastChannel('rwa_bus:' + topic);
  if (typeof ch.unref === 'function') ch.unref();
  const handler = (evt) => {
    const data = evt && evt.data;
    if (!data || data.from === DOC_UUID) return;
    try { callback(data); } catch (_) { /* never let a subscriber break delivery */ }
  };
  ch.addEventListener('message', handler);
  return () => { ch.removeEventListener('message', handler); ch.close(); };
}

// === First-class runtime modes =============================================
// Modes are page-load local state, deliberately not serialized into INLINE_DOC.
// A document container opens EDIT-first ("the document is the editor" — click
// anywhere and type); view-first kinds (presentation et al.) open in Document
// (reading) mode. Edit is the only mode that attaches WYSIWYG/lens/image editing
// affordances. The View/Edit segmented control flips between Document and Edit.
const RWA_MODES = Object.freeze(['document', 'edit', 'skills', 'actions']);
let rwaMode = (PRODUCT_KIND === 'document') ? 'edit' : 'document';

function escRuntimeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function isRwaSkillHost() {
  return PRODUCT_KIND === 'skill-host' && !!document.getElementById('rwa-skills');
}

function closeRuntimePanels() {
  for (const id of ['rwa-set-panel', 'rwa-info-panel', 'rwa-skin-panel', 'rwa-share-panel', 'rwa-hostedit-panel', 'rwa-ai-panel', 'rwa-mode-panel']) {
    const el = document.getElementById(id);
    if (el) el.classList.remove('open');
  }
  const hist = document.getElementById('rwa-lens-hist-panel');
  if (hist) hist.hidden = true;
  const menu = document.getElementById('rwa-st-menu-panel');
  if (menu && !menu.hidden) { menu.hidden = true; const mb = document.getElementById('rwa-st-menu'); if (mb) mb.setAttribute('aria-expanded', 'false'); }
}

function hideEditTransients() {
  if (typeof exitInlineEdit === 'function') exitInlineEdit();
  if (typeof releaseAnchor === 'function') releaseAnchor();
  if (typeof closePal === 'function') closePal();
  if (typeof clearDropMark === 'function') clearDropMark();
  if (typeof hideSelectionCommandBar === 'function') hideSelectionCommandBar();
  const chip = document.getElementById('rwa-img-chip');
  if (chip) chip.hidden = true;
  const hist = document.getElementById('rwa-lens-hist-panel');
  if (hist) hist.hidden = true;
}

function syncModeChrome() {
  if (document.body) document.body.dataset.rwaMode = rwaMode;
  document.querySelectorAll('[data-rwa-mode-target]').forEach(btn => {
    const on = btn.dataset.rwaModeTarget === rwaMode; // View/Edit segments + Skills/Activity menu items
    btn.classList.toggle('on', on);
    if (btn.hasAttribute('aria-pressed')) btn.setAttribute('aria-pressed', String(on));
  });
  const panel = document.getElementById('rwa-mode-panel');
  if (!panel) return;
  if (rwaMode === 'skills' || rwaMode === 'actions') {
    panel.classList.add('open');
    renderModePanel().catch(err => {
      panel.innerHTML = '<h4>' + escRuntimeHtml(rwaMode) + '</h4><p>Could not render this panel: ' + escRuntimeHtml(err?.message || err) + '</p>';
    });
  } else {
    panel.classList.remove('open');
  }
  if (typeof syncViewChrome === 'function') syncViewChrome();
}

function runtimeSetMode(mode) {
  if (!RWA_MODES.includes(mode)) throw new Error('unknown mode: ' + mode);
  if (modifyMutex) {
    setStatus('err', '✗ modify in progress');
    throw new Error('cannot switch mode during modify');
  }
  if (mode === rwaMode) {
    syncModeChrome();
    return rwaMode;
  }
  if (rwaMode === 'edit' || mode !== 'edit') hideEditTransients();
  closeRuntimePanels();
  if (mode === 'edit' && activeView) {
    activeView = null;
    try { sessionStorage.setItem(rwaViewKey(), ''); } catch (_) {}
  }
  rwaMode = mode;
  syncModeChrome();
  emitRuntimeEvent('mode', { mode: rwaMode });
  getDoc().then(d => renderDoc(canonLF(d))).catch(() => {});
  return rwaMode;
}

async function renderModePanel() {
  const panel = document.getElementById('rwa-mode-panel');
  if (!panel) return;
  if (rwaMode === 'skills') return renderSkillsModePanel(panel);
  if (rwaMode === 'actions') return renderActionsModePanel(panel);
}

function attachModeTabs() {
  document.querySelectorAll('[data-rwa-mode-target]').forEach(btn => {
    btn.addEventListener('click', () => runtimeSetMode(btn.dataset.rwaModeTarget));
  });
  syncModeChrome();
}

// === Status surface (spec §7) ==============================================
// FSA permission state. Tracked here rather than re-derived each call because
// the permission events that move it (showSaveFilePicker, queryPermission,
// requestPermission, lost-handle InvalidStateError) are scattered across the
// commit() path; centralizing the mutation keeps the status snapshot honest.
//
// Values:
//   'unsupported' — no showSaveFilePicker in the runtime (Firefox/Safari)
//   'prompt'      — handle exists but the user hasn't granted yet this session
//   'granted'     — user said yes; subsequent writes won't reprompt
//   'denied'      — user said no
//   'lost'        — a write threw InvalidStateError (handle no longer valid)
let _fsaState = (typeof window !== 'undefined' && 'showSaveFilePicker' in window) ? 'prompt' : 'unsupported';
// Last storage estimate captured by rwaCheckQuota. null until the first
// successful estimate() — keeps the shape testable on platforms that don't
// expose navigator.storage.estimate at all.
let _storageStat = null;

function getStatusSnapshot() {
  return {
    dirty: !!document.getElementById('rwa-st-commit')?.classList.contains('dirty'),
    fsa: _fsaState,
    storage: _storageStat,
  };
}

// === Modify/commit/undo programmatic wrappers (spec §7) ====================
// Thin wrappers around the internal lifecycle. Wrappers (not direct exposure)
// so a doc-side caller can't accidentally shadow or swap the internal
// references that the lens/agent paths rely on.
async function runtimeModify(instruction) { return modify(instruction); }
async function runtimeCommit() { return commit(); }
async function runtimeUndo() { return undo(); }
// Direct envelope application — for product-kind UIs (the workflow's visual
// gestures, future app artifacts) that synthesize their own apply_edits
// envelopes without going through the agent loop. Commits through
// synthesizeAndCommit so the audit log, frozen-zone checks, shape-check,
// undo stack, and runtime events all fire as if the edit came from the lens.
// Surface labels the originator (e.g. "visual:wf-drag-reorder") so rwa_hist
// distinguishes client-driven edits from agent-driven ones.
async function runtimeApplyEnvelope(envelope, options) {
  options = options || {};
  if (!envelope || typeof envelope !== 'object') throw new TypeError('runtime.applyEnvelope: envelope is required');
  // images-v1: options.assets (Map token→data URI) lets a writer send its
  // envelope in token form — see commitCore. Absent → byte-identical path.
  return synthesizeAndCommit(envelope, options.surface || 'runtime:apply-envelope', options.instruction || '', options.actor, options.assets);

async function getDoc() {
  let d = await idbGet(RWA.DOC);
  if (d == null) { d = INLINE_DOC; await idbPut(RWA.DOC, d); }
  return d;
}
async function popUndo() {
  // Read+write in one tx: rapid ⌘Z keypresses would otherwise interleave the
  // get and the put, both observe the same array, both pop the same entry,
  // and the user would see only one undo for two presses.
  const db = await openDB();
  return new Promise((res, rej) => {
    const tx = db.transaction(RWA.UNDO, 'readwrite');
    const store = tx.objectStore(RWA.UNDO);
    const r = store.get(RWA.KEY);
    let v = null;
    r.onsuccess = () => {
      const s = r.result || [];
      if (!s.length) return;
      v = s.pop();
      store.put(s, RWA.KEY);
    };
    tx.oncomplete = () => res(v);
    tx.onerror = () => rej(tx.error || new Error('popUndo tx error'));
    tx.onabort = () => rej(tx.error || new Error('popUndo tx aborted'));
  });
}
// ─── Render ─────────────────────────────────────────────────────────
function renderDoc(html) {
  const m = document.getElementById('rwa-doc-mount');
  // rwa-lens/1: if the lens has been re-parented into the mount (anchored
  // state in Task 5.2), release it before we wipe innerHTML — otherwise the
  // lens DOM disappears with the mount's children, leaving stale lensState.
  // The source map is about to rebuild, so the held entry is invalid anyway.
  if (typeof releaseAnchor === 'function') {
    const lens = document.getElementById('rwa-lens');
    if (lens && m.contains(lens)) releaseAnchor();
  }
  // rwa inline-edit: an open hand-edit is about to be wiped by the innerHTML
  // reset below. The commit path already exits before its own re-render, so
  // this only fires for unrelated renders (agent commit, __setDocForTest); it
  // drops the stale edit-surface state + its element listeners.
  if (typeof exitInlineEdit === 'function') exitInlineEdit();
  // Capture id-keyed form state so user-entered values survive an unrelated
  // edit (the doc gets re-rendered via innerHTML, which would otherwise
  // destroy them). Spec/benchmark APP-01/APP-02. Only id-keyed elements
  // round-trip — anonymous inputs are inherently unmappable across renders.
  const captured = new Map();
  m.querySelectorAll('input,textarea,select,details').forEach(el => {
    if (!el.id) return;
    if (el.tagName === 'DETAILS') captured.set(el.id, { kind: 'details', open: el.open });
    else captured.set(el.id, { kind: 'value', value: el.value });
  });
  // C2 seam (spec §5.10). render() output is mount-only and is NEVER read back
  // into the doc text — `html` (the stored text) is what reaches setSourceMap /
  // commit, which is WHY data-rwa-id and frozen zones survive (Invariant 8).
  // For activeView===null (every non-presentation container) this is exactly
  // today's behavior: mountHtml === html, no class added. A view whose output
  // violates the contract fails SOFT here (fall back to the plain doc + status)
  // so it can never brick a container at render time; setView's pre-activation
  // probe is the fail-LOUD gate for the user action.
  let mountHtml = html;
  if (activeView) {
    try {
      mountHtml = validateViewOutput(activeView.render(html, viewCtx()), activeView);
      m.classList.add('viewmode-' + activeView.name);
    } catch (e) {
      if (typeof setStatus === 'function') setStatus('err', '✗ view error: ' + e.message);
      mountHtml = html;
      m.classList.remove('viewmode-' + activeView.name);
    }
  } else {
    m.classList.remove('viewmode-presentation');
  }
  m.innerHTML = mountHtml;
  m.querySelectorAll('script').forEach(o => {
    const s = document.createElement('script');
    for (const a of o.attributes) s.setAttribute(a.name, a.value);
    s.textContent = o.textContent;
    o.parentNode.replaceChild(s, o);
  });
  for (const [id, snap] of captured) {
    const el = m.querySelector('#' + (typeof CSS !== 'undefined' && CSS.escape ? CSS.escape(id) : id));
    if (!el) continue;
    if (snap.kind === 'details' && el.tagName === 'DETAILS') el.open = snap.open;
    else if (snap.kind === 'value' && 'value' in el) el.value = snap.value;
  }
  // rwa-lens/1: rebuild the source-position map so anchored interactions stay
  // aligned with the just-rendered doc. setSourceMap is declared further down
  // in this script — JS hoisting (script-mode `function` declarations) makes
  // it callable here even though renderDoc is defined first.
  // §5.10 clause 2 / Invariant 9: the source map + locked ranges derive from the
  // STORED doc text (`html`), never the (possibly view-wrapped) `mountHtml` — so
  // the agent's view of the document is invisible-by-construction to any render mode.
  setSourceMap(html);
  rebuildLockedRanges(html);
  const editReady = rwaMode === 'edit' && !activeView;
  // rwa-lens/1: click-to-anchor (Task 5.1). renderDoc runs on every commit and
  // on bootstrap; remove first so listeners don't multiply across renders. Same
  // function reference, so removing the previous instance is safe. With a
  // whole-mount view active, byte-offset click resolution is undefined, so the
  // listener is removed and not re-added (§5.10). For activeView===null this is
  // byte-identical to the previous behavior.
  m.removeEventListener('click', handleMountClick);
  if (editReady) m.addEventListener('click', handleMountClick);
  // rwa inline-edit: leaf text blocks behave like page text in an editor.
  // Pointer-down starts editing early enough for the browser to place the caret
  // where the user clicked; dblclick stays registered for old tests/muscle
  // memory; keydown gives keyboard users a non-pointer entry path. Same
  // remove-then-add discipline as click-to-anchor; not registered under an
  // active view (byte-offset resolution is undefined there).
  if (typeof refreshInlineEditAffordances === 'function') refreshInlineEditAffordances(m);
  m.removeEventListener('pointerdown', handleMountPointerDown);
  m.removeEventListener('dblclick', handleMountDblClick);
  m.removeEventListener('keydown', handleMountEditKeydown);
  if (editReady) {
    m.addEventListener('pointerdown', handleMountPointerDown);
    m.addEventListener('dblclick', handleMountDblClick);
    m.addEventListener('keydown', handleMountEditKeydown);
  }
  // images-v1: drag-drop insert + hover-✕ chip. Same remove-then-add
  // discipline; inert under a render mode (byte-offset resolution undefined).
  // The chip/drop-mark reference DOM the innerHTML reset just destroyed.
  if (typeof clearDropMark === 'function') clearDropMark();
  const imgChip = document.getElementById('rwa-img-chip');
  if (imgChip) imgChip.hidden = true;
  m.removeEventListener('dragover', handleMountDragOver);
  m.removeEventListener('dragleave', handleMountDragLeave);
  m.removeEventListener('drop', handleMountDrop);
  m.removeEventListener('mouseover', handleMountImgOver);
  m.removeEventListener('mouseout', handleMountImgOut);
  m.removeEventListener('touchstart', handleMountImgOver);
  if (editReady) {
    m.addEventListener('dragover', handleMountDragOver);
    m.addEventListener('dragleave', handleMountDragLeave);
    m.addEventListener('drop', handleMountDrop);
    m.addEventListener('mouseover', handleMountImgOver);
    m.addEventListener('mouseout', handleMountImgOut);
    // Touch equivalent (#10): the resize/remove chip was hover-only, so on a coarse pointer an
    // inserted image had no affordance at all. A tap on the image reuses the same handler the
    // hover path uses — handleMountImgOver reads e.target, so a touch event serves it unchanged.
    m.addEventListener('touchstart', handleMountImgOver, { passive: true });
  }
  // §5.10: post-mount provider seam. render() stays a pure string->string slot;
  // mounted() is the impure slot that restores transient UI state (slide index)
  // after innerHTML + script-rerun + form-restore.
  if (activeView && typeof activeView.mounted === 'function') {
    activeView.mounted(m, viewCtx());
  }
  if (PRODUCT_KIND === 'workspace' && typeof renderWorkspacePresence === 'function') {
    renderWorkspacePresence();
  }
  // #21 — the loop's first sense: measure the page that was just painted.
  // Last, so it sees the final mounted state (view render, restored form state,
  // re-run scripts); advisory, so nothing above it depends on the result.
  rwaProbeRender(m);
}

// ─── Workspace presence over runtime.bus ─────────────────────────────
const RWA_WORKSPACE_PRESENCE_TOPIC = 'workspace:presence';
let workspacePresenceTimer = null;
let workspacePresenceUnsub = null;
let workspaceMonitorUnsub = null;
const workspacePeers = new Map();

function rwaLocationSansHash() {
  try {
    const u = new URL(location.href);
    u.hash = '';
    return u.href;
  } catch (_) {
    return String(location.href || '').split('#')[0];
  }
}

function rwaDirectoryHref(href) {
  try { return new URL('.', href || location.href).href; }
  catch (_) { return ''; }
}

function sameWorkspaceDirectory(href) {
  const mine = rwaDirectoryHref(rwaLocationSansHash());
  const theirs = rwaDirectoryHref(href);
  return !!mine && !!theirs && mine === theirs;
}

function workspacePresencePayload(action) {
  const d = runtimeDescribe();
  return {
    schema: 'rwa-presence/1',
    action,
    uuid: DOC_UUID,
    kind: PRODUCT_KIND,
    title: d.title || document.title || RWA.FILE,
    file: RWA.FILE,
    url: rwaLocationSansHash(),
    affordances: Array.isArray(d.affordances) ? d.affordances.map(a => ({ kind: a.kind, name: a.name, label: a.label, provenance: a.provenance })) : [],
  };
}

function workspaceManifestDocs() {
  const el = document.getElementById('rwa-workspace');
  if (!el) return [];
  try {
    const parsed = JSON.parse(el.textContent || '{}');
    return Array.isArray(parsed.documents) ? parsed.documents : [];
  } catch (_) {
    return [];
  }
}

function workspaceKnownKeys() {
  const keys = new Set();
  for (const d of workspaceManifestDocs()) {
    if (d && d.uuid) keys.add('uuid:' + d.uuid);
    if (d && d.file) keys.add('file:' + d.file);
  }
  return keys;
}

function workspacePeerKnown(peer, known) {
  return !!(peer && ((peer.uuid && known.has('uuid:' + peer.uuid)) || (peer.file && known.has('file:' + peer.file))));
}

function safeWorkspaceHref(url) {
  // peer.url arrives over the public presence bus from another page in the origin,
  // so it is untrusted. escRuntimeHtml blocks attribute breakout but NOT a
  // `javascript:`/`data:` scheme, which would execute on click. Resolve and accept
  // only navigable web/file schemes; fall back to '#' for anything else or unparsable.
  try {
    const u = new URL(url, location.href);
    if (u.protocol === 'http:' || u.protocol === 'https:' || u.protocol === 'file:') return u.href;
  } catch (_) {}
  return '#';
}

function workspacePresenceCard(peer, known) {
  const isKnown = workspacePeerKnown(peer, known);
  const href = safeWorkspaceHref(peer.url);
  const aff = peer.affordances && peer.affordances.length ? peer.affordances.map(a => a.kind).join(', ') : 'baseline';
  return '<a class="rwa-ws-card rwa-ws-live-card" href="' + escRuntimeHtml(href) + '">' +
    '<span class="rwa-ws-kind">' + escRuntimeHtml(peer.kind || 'document') + '</span>' +
    '<strong>' + escRuntimeHtml(peer.title || peer.file || 'Untitled') + '</strong>' +
    '<span>' + escRuntimeHtml(peer.file || peer.url || peer.uuid || '') + '</span>' +
    '<small>' + (isKnown ? 'indexed' : 'new since sync') + ' · open now · ' + escRuntimeHtml(aff) + '</small>' +
    '</a>';
}

function renderWorkspacePresence() {
  if (PRODUCT_KIND !== 'workspace') return;
  const root = document.querySelector('[data-rwa-workspace-live]');
  if (!root) return;
  const grid = root.querySelector('[data-rwa-workspace-live-grid]');
  if (!grid) return;
  const cutoff = Date.now() - 45000;
  const peers = [...workspacePeers.values()]
    .filter(p => p && p.lastSeen >= cutoff && sameWorkspaceDirectory(p.url))
    .sort((a, b) => String(a.title || a.file || '').localeCompare(String(b.title || b.file || '')));
  root.hidden = peers.length === 0;
  if (!peers.length) { grid.innerHTML = ''; return; }
  const known = workspaceKnownKeys();
  grid.innerHTML = peers.map(p => workspacePresenceCard(p, known)).join('');
}

function handleWorkspacePresence(envelope) {
  const msg = envelope && envelope.message;
  if (!msg || msg.schema !== 'rwa-presence/1') return;
  if (msg.action === 'request') {
    runtimeBusPublish(RWA_WORKSPACE_PRESENCE_TOPIC, workspacePresencePayload('hello'));
    return;
  }
  if (PRODUCT_KIND !== 'workspace' || msg.action !== 'hello' || !sameWorkspaceDirectory(msg.url)) return;
  workspacePeers.set(msg.uuid || envelope.from, { ...msg, lastSeen: Date.now() });
  renderWorkspacePresence();
}

function startWorkspacePresence() {
  try {
    workspacePresenceUnsub = runtimeBusSubscribe(RWA_WORKSPACE_PRESENCE_TOPIC, handleWorkspacePresence);
    runtimeBusPublish(RWA_WORKSPACE_PRESENCE_TOPIC, workspacePresencePayload('hello'));
    if (!(typeof navigator !== 'undefined' && /jsdom/i.test(navigator.userAgent || ''))) {
      workspacePresenceTimer = setInterval(() => {
        runtimeBusPublish(RWA_WORKSPACE_PRESENCE_TOPIC, workspacePresencePayload('hello'));
        if (PRODUCT_KIND === 'workspace') renderWorkspacePresence();
      }, 15000);
      if (workspacePresenceTimer && typeof workspacePresenceTimer.unref === 'function') workspacePresenceTimer.unref();
    }
    if (PRODUCT_KIND === 'workspace') {
      workspaceMonitorUnsub = () => {};
      setTimeout(() => runtimeBusPublish(RWA_WORKSPACE_PRESENCE_TOPIC, workspacePresencePayload('request')), 50);
    }
  } catch (_) {
    // BroadcastChannel is unavailable in some constrained contexts. The durable
    // workspace manifest still works; only live autodiscovery is disabled.
  }
}

// ─── URL fragment scroll (rwa-bootstrap 0.9) ───────────────────────
// Resolves `location.hash` against either a literal `id=` attribute or a
// runtime-assigned `data-rwa-id`. On hit, scrolls the target into view and
// pulses it with a blue-tint background fade so the location is obvious
// after the scroll. Idempotent — wired to both the initial load (called from
// the bootstrap IIFE) and `hashchange` (any in-page navigation).
function scrollToFragment() {
  if (!location.hash || location.hash.length < 2) return;
  let raw;
  try { raw = decodeURIComponent(location.hash.slice(1)); } catch (_) { raw = location.hash.slice(1); }
  if (!raw) return;
  const mount = document.getElementById('rwa-doc-mount');
  if (!mount) return;
  let el = null;
  try {
    const esc = (typeof CSS !== 'undefined' && CSS.escape) ? CSS.escape(raw) : raw.replace(/(["\\])/g, '\\$1');
    el = mount.querySelector('#' + esc + ', [data-rwa-id="' + esc + '"]');
  } catch (_) {
    el = mount.querySelector('[data-rwa-id="' + raw.replace(/"/g, '\\"') + '"]');
  }
  if (!el) return;
  // §5.10 clause 3: a render mode may hide the target block (presentation hides
  // inactive slides with display:none). Let the active view reveal the owning
  // region first, or scrollIntoView is a no-op on a hidden node. Wired to both
  // initial load and hashchange (this function handles both).
  if (activeView && typeof activeView.reveal === 'function') activeView.reveal(mount, el);
  el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  el.classList.add('rwa-frag-pulse');
  setTimeout(() => { el.classList.remove('rwa-frag-pulse'); }, 1700);
}
window.scrollToFragment = scrollToFragment; // expose for tests

// ─── File rebuild ───────────────────────────────────────────────────
let FROZEN = '';
const escapeTL = s => canonLF(s)
  .replace(/\\/g, '\\\\')
  .replace(/`/g, '\\`')
  .replace(/\$\{/g, '\\${')
  .replace(/<\/script/gi, '<\\/script');
function buildFile(doc) {
  const marker = 'const INLINE_DOC = `';
  const start = FROZEN.indexOf(marker);
  if (start < 0) throw new Error('cannot locate INLINE_DOC');
  const cs = start + marker.length;
  let i = cs;
  while (i < FROZEN.length) {
    if (FROZEN[i] === '\\') { i += 2; continue; }
    if (FROZEN[i] === '`') break;
    i++;
  }
  if (i >= FROZEN.length) throw new Error('unterminated INLINE_DOC');
  return FROZEN.slice(0, cs) + escapeTL(doc) + FROZEN.slice(i);
}

      return doc;
