    if (fileHash === baseline.baseHash) return doc; // §3.3 row 2 — unchanged, IDB wins
    if ((await rwaGetDirtyCount()) === 0) {
      // §3.3 row 3 — the file moved, nothing local is unsaved: adopt it.
      // LF-canonical: rwa_doc is what the rwa-edit/1 contract operates on, and
      // every other write path canonicalises before storing. Blessing runs on
      // the returned doc back in the boot IIFE.
      const adopted = canonLF(INLINE_DOC);
      await idbPut(RWA.DOC, adopted);
      await rwaWriteBaseline(fileHash);
      return adopted;
    }
    // §3.3 row 4 — genuine divergence. Never pick silently: render from IDB
    // unchanged, surface the bar, and block ⌘S until the user resolves it.
    rwaDivergence = { fileHash };
    showReconcileBar();
    return doc;
  } catch (_) {
    return doc;
  }
}

// §3.5: a PERSISTENT bar, not a toast — stays until Keep/Use resolves it.

// ─── Cross-tab commit signal (#20) ──────────────────────────────────
// Boot reconciliation closed "the FILE changed underneath us". This closes its
// sibling: another TAB of the same container changed rwa_doc underneath us.
//
// Why it can lose work despite every commit path re-reading rwa_doc first:
// modify() reads the doc, then spends SECONDS in a model call, and only then
// applies its edits and commits. A commit landing from another tab inside that
// window is overwritten with no trace anywhere — no error, no history entry,
// no bar. rwa-edit-spec §5.6 records cross-tab modify as "not supported", which
// in practice meant "silently picks one side", the exact thing boot
// reconciliation exists to refuse.
//
// BroadcastChannel carries the signal. That it works at all here is NOT
// obvious and was verified before this was built (2026-08-26): file:// pages
// are opaque origins, and although the runtime.db fan-out already used
// BroadcastChannel and called itself "cross-tab", nothing had ever checked
// delivery BETWEEN two file:// tabs. It delivers.
//
// The channel name reuses the runtime.db namespace with the store slot set to a
// RESERVED store name, so no document-declared store can ever subscribe to it —
// assertRuntimeDbStore rejects the rwa_ prefix.
//
// This WARNS; it deliberately does not block. The bar appears when the other tab
// commits — i.e. before this tab's next edit, while the choice is still the
// user's — so the loss stops being silent, which is the defect. Hard-blocking a
// commit mid-agent-retry would be a far larger behavioural change than the bug
// warrants, and boot reconciliation already owns the "two versions, pick one"
// conversation on reload.
const RWA_TAB_ID = (() => {
  try { return crypto.randomUUID(); } catch (_) { return String(Math.random()).slice(2) + Date.now(); }
})();
const RWA_DOC_CHANNEL = 'rwa_' + DOC_UUID + ':rwa_doc';
let rwaLastKnownDocHash = null; // what THIS tab believes rwa_doc holds
let rwaForeignCommit = null;    // { at } while unresolved
let _rwaDocChannel;             // undefined = not tried, null = unavailable

function rwaDocChannel() {
  if (_rwaDocChannel === undefined) {
    try { _rwaDocChannel = new BroadcastChannel(RWA_DOC_CHANNEL); }
    catch (_) { _rwaDocChannel = null; } // degrade to the visibility re-check below
  }
  return _rwaDocChannel;
}

// Record what this tab now believes the document is. `broadcast` tells sibling
// tabs; boot passes false because nothing was committed. Every failure is
// swallowed: this is an advisory signal and must never break a commit that has
// already landed, nor a boot on a runtime without crypto.subtle (where the hash
// stays null and staleness simply goes unreported rather than misreported).
async function rwaNoteDocSeen(doc, broadcast) {
  // Every path that moves rwa_doc calls this, plus boot — so it is also the one
  // place that reliably knows "the document is now X", which is exactly what the
  // size meter (#24) needs. Kept first: a hash failure must not skip the meter.
  rwaCheckDocSize(doc);
  try {
    rwaLastKnownDocHash = await rwaSha256Hex(canonLF(doc));
    if (!broadcast) return;
    const ch = rwaDocChannel();
    if (ch) ch.postMessage({ from: RWA_TAB_ID, hash: rwaLastKnownDocHash, at: Date.now() });
  } catch (_) { /* advisory only */ }
}

async function rwaCheckForeignCommit() {
  try {
    if (rwaLastKnownDocHash === null) return;  // nothing to compare against
    const stored = await idbGet(RWA.DOC);
    if (typeof stored !== 'string') return;
    if ((await rwaSha256Hex(canonLF(stored))) === rwaLastKnownDocHash) return;
    rwaForeignCommit = { at: Date.now() };
    showForeignCommitBar();
  } catch (_) { /* advisory only */ }
}

function startCrossTabWatch() {
  const ch = rwaDocChannel();
  if (ch) {
    ch.onmessage = (e) => {
      const d = e && e.data;
      if (!d || d.from === RWA_TAB_ID) return;            // our own echo
      if (!d.hash || d.hash === rwaLastKnownDocHash) return; // same bytes, nothing to say
      rwaForeignCommit = { at: d.at || Date.now() };
      showForeignCommitBar();
    };
  }
  // A frozen or throttled tab may never be handed the message, and BroadcastChannel
  // is absent entirely on some runtimes. Re-checking against IDB on foreground is
  // deterministic and is the only path that works with no channel at all — so the
  // signal degrades to "noticed a little later" rather than to nothing.
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') rwaCheckForeignCommit();
  });
}

function showForeignCommitBar() {
  let bar = document.getElementById('rwa-foreign-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'rwa-foreign-bar';
    bar.setAttribute('role', 'alert');
    bar.innerHTML =
      '<span>Another tab changed this document. What you see here is older — saving or editing now would drop that change.</span>' +
      '<button type="button" data-act="reload">Reload this tab</button>' +
      '<button type="button" data-act="dismiss">Keep this version</button>';
    bar.addEventListener('click', (e) => {
      const act = e.target && e.target.getAttribute && e.target.getAttribute('data-act');
      // Reload deliberately just reloads: boot reconciliation already knows how to
      // present two versions properly. Two mechanisms for one decision would drift.
      if (act === 'reload') location.reload();
      else if (act === 'dismiss') { rwaForeignCommit = null; hideForeignCommitBar(); }
    });
    document.body.appendChild(bar);
  }
  bar.hidden = false;
}
function hideForeignCommitBar() {
  const bar = document.getElementById('rwa-foreign-bar');
  if (bar) bar.hidden = true;
}

// Save-time divergence (#14). Set only by the user choosing "Overwrite anyway", and cleared after
// the write, so a forced save never silently becomes the new default.
let _forceOverwrite = false;

// Has the file changed underneath us since our last successful save?
//
// Factored out of commit() so the DECISION is testable on its own: a real
// FileSystemFileHandle is structured-cloneable and a fake one is not, so a fake cannot be seeded
// into rwa_fsa (fake-indexeddb rejects it with DataCloneError) — which is why nothing in this repo
// has ever unit-tested the FSA commit path. Taking the handle as an argument sidesteps that
// entirely. The wiring inside commit() remains browser-verified only; see
// docs/cloud-sync-investigation-2026-08-05.md.
//
// Absent baseline → false (proceed). A container that has never saved from this browser knows
// nothing about the file's history, and guessing could destroy work — the same reasoning as boot
// reconciliation's absent-baseline row.
async function fileChangedSinceLastSave(handle) {
  try {
    const prior = await idbGet(RWA.STATE, 'file_baseline');
    if (!prior || !prior.hash) return false;
    const onDisk = await (await handle.getFile()).text();
    return (await rwaSha256Hex(onDisk)) !== prior.hash;
  } catch (_) {
    return false;   // unreadable handle → let the write path report it, don't block on a guess
  }
}
function showOverwriteBar() {
  let bar = document.getElementById('rwa-overwrite-bar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'rwa-overwrite-bar';
    bar.setAttribute('role', 'alert');
    bar.innerHTML =
      '<span>This file changed on disk since you last saved — a sync client, another tab, or another editor.</span>' +
      '<button type="button" data-act="overwrite">Overwrite with my version</button>' +
      '<button type="button" data-act="reload">Reload and compare</button>';
    bar.addEventListener('click', (e) => {
      const act = e.target && e.target.getAttribute && e.target.getAttribute('data-act');
      if (act === 'overwrite') { _forceOverwrite = true; hideOverwriteBar(); commit(); }
      // "Reload" deliberately just reloads: boot reconciliation already knows how to present this
      // choice properly, with the undo stack intact. Two mechanisms for one decision would drift.
      else if (act === 'reload') { location.reload(); }
    });
    document.body.appendChild(bar);
  }
  bar.hidden = false;
}
function hideOverwriteBar() {
  const bar = document.getElementById('rwa-overwrite-bar');
  if (bar) bar.hidden = true;
}

// Issue #5 — a PERSISTENT bar (own id/class, distinct from #rwa-reconcile-bar)
// telling the user WHY a commit was refused and how to proceed: a user who
// legitimately wants AI-authored interactive content (a chart, say) needs a
// way forward instead of a dead end. "Allow" flips the rwa_state capability
// flag scriptsAllowed() reads; "Dismiss" just hides the bar.

  let bar = document.getElementById('rwa-scripts-bar');
  if (!bar) {

}
// A commit refusal reports script_introduction_denied through several call
// sites (modify's retry-exhausted path, its outer catch for the compose path,
// modifyViaBridge, modifyViaSession) — one place decides whether to surface
// the bar so all of them stay in step.

}

// "Keep my edits" (§7): the edits are still live and unsaved, so dirty_count is
// untouched — only the baseline advances, acknowledging the new file bytes
// without adopting them.
async function rwaReconcileKeepMine() {
  if (!rwaDivergence) return;
  try { await rwaWriteBaseline(rwaDivergence.fileHash); } catch (_) {}
  rwaDivergence = null;
  hideReconcileBar();
  setStatus('ok', '● ready');
}

// "Use the file version" (§3.5/§7): push the superseded doc onto rwa_undo
// first (⌘Z recovers it), then adopt INLINE_DOC and clear dirty_count —
// adopting the file means the edits are no longer in rwa_doc, so a nonzero
// counter would misreport unsaved work the live document no longer contains.
async function rwaReconcileUseFile() {
  if (!rwaDivergence) return;
  try {
    const superseded = await getDoc();
    const undoArr = (await idbGet(RWA.UNDO)) || [];
    undoArr.push(superseded);
    while (undoArr.length > RWA.UNDO_CAP) undoArr.shift();
    await idbPut(RWA.UNDO, undoArr);
    // Adopt LF-canonical AND blessed. Boot gets blessing for free because
    // reconciliation runs before it; this mid-session path does not, and both
    // the anchor map and URL-fragment links need data-rwa-id present. The
    // baseline still records the FILE's hash — it tracks the file body, not
    // rwa_doc, so blessing here cannot desync it.
    let adopted = canonLF(INLINE_DOC);
    const idRes = injectMissingBlockIds(adopted);
    if (idRes.assigned > 0) adopted = idRes.text;
    await idbPut(RWA.DOC, adopted);
    await rwaNoteDocSeen(adopted, true); // #20 — adopting the file version moves rwa_doc
    await rwaWriteBaseline(rwaDivergence.fileHash);
    await rwaResetDirtyCount();
    rwaDivergence = null;
    hideReconcileBar();
    renderDoc(adopted);
    setStatus('ok', '● ready');
  } catch (e) {
    setStatus('err', '✗ ' + e.message);
  }
}

// Non-goal for v1 (§6): no diff algorithm — states that the file changed, not how.
function rwaReconcileShowDiff() {
  setStatus('', 'no diff view yet — the file body changed outside the browser');
}

// Task 9.3: read-only render of rwa_hist into the side panel. Read once on
// open — the panel is a snapshot, not a live view. Newest first matches the
// existing convention (commitDoc unshifts onto the array).
async function renderHistoryPanel(panel) {
  const fmtTs = (ts) => {
    try { return new Date(ts).toLocaleString(); } catch { return String(ts); }
  };
  const escHtml = (s) => String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const fmtScope = (scope) => {
    if (!scope) return '';
    if (scope.type === 'eof') return 'eof';
    if (scope.type === 'block') return 'block @' + (scope.block_id || '?');
    return scope.type || '';
  };
  let entries = [];
  try { entries = (await idbGet(RWA.HIST)) || []; } catch { entries = []; }
  const header = '<h3>History <button type="button" id="rwa-lens-hist-close" aria-label="close">×</button></h3>';
  if (!entries.length) {
    panel.innerHTML = header + '<div class="rwa-hist-empty">No history yet — make an edit and it will appear here.</div>';
  } else {
    const rows = entries.map(e => {
      const surface = e.surface || e.kind || 'edit';
      const scopeStr = fmtScope(e.scope);
      const instr = e.instruction || (e.kind === 'replace_document' ? (e.reason || '(replace_document)') : '(no instruction recorded)');
      return '<div class="rwa-hist-row">'
        + '<div class="rwa-hist-meta">'
        + '<span class="rwa-hist-surface">' + escHtml(surface) + '</span>'
        + (e.actor ? '<span class="rwa-hist-actor" title="' + escHtml(e.actor) + '">' + escHtml(e.actor) + '</span>' : '')
        + (scopeStr ? '<span>' + escHtml(scopeStr) + '</span>' : '')
        + '<span>' + escHtml(fmtTs(e.ts)) + '</span>'
        + '</div>'
        + '<div class="rwa-hist-instr">' + escHtml(instr) + '</div>'
        + '</div>';
    }).join('');
    panel.innerHTML = header + rows;
  }
  const closeBtn = panel.querySelector('#rwa-lens-hist-close');
  if (closeBtn) closeBtn.addEventListener('click', () => { panel.hidden = true; });
}

function renderSkillsModePanel(panel) {

        const raw = (inputEl && inputEl.value || '').trim();

      } catch (e) {
        if (resultEl) { resultEl.hidden = false; resultEl.textContent = 'Invalid JSON input'; }

        if (resultEl) { resultEl.hidden = false; resultEl.textContent = e?.message || String(e); }
      } finally {
        btn.disabled = false;
      }
    });
  });
}

  if (undoBtn) undoBtn.addEventListener('click', () => runtimeUndo());
  const saveBtn = panel.querySelector('#rwa-actions-save');
  if (saveBtn) saveBtn.addEventListener('click', () => runtimeCommit());
  const shareBtn = panel.querySelector('#rwa-actions-share');
  if (shareBtn) shareBtn.addEventListener('click', async () => {
    document.getElementById('rwa-mode-panel')?.classList.remove('open');
    await renderSharePanel();
    document.getElementById('rwa-share-panel')?.classList.add('open');
  });
  const viewBtn = panel.querySelector('#rwa-actions-view');
  if (viewBtn && viewAff) viewBtn.addEventListener('click', () => runtimeSetView(d.activeView === viewAff.name ? null : viewAff.name));
  panel.querySelectorAll('[data-action-skill]').forEach(btn => {
    btn.addEventListener('click', () => runtimeSetMode('skills'));
  });
}

// AI panel (drop-in AI UX §2) — the chip-click surface that absorbed the Activity panel's
// "Intelligences" section. The active role renders first as a card (name, description,
// connection status from the live session); other installed roles keep the Activate /
// advisor button contracts (data-agent-on/off/advon/advoff) verbatim. Activating offers the
// role's recommended model (intelligence/0.2 I-A). A verified role can be activated;
// unverified cannot. The footer always invites the drop gesture + the AI Gallery, with the
// ⚙ settings form as the manual escape hatch (v1: Connect = open settings too).
function renderAiPanel(panel) {
  if (!panel) return;
  const agentList = (typeof runtimeListAgents === 'function') ? runtimeListAgents() : [];
  const activeRole = ((typeof runtimeAgentActive === 'function' && runtimeAgentActive()) || {}).role || null;
  const advisorSet = (typeof runtimeListAdvisors === 'function') ? runtimeListAdvisors() : [];
  const advisorFull = advisorSet.length >= 3;
  const rows = [];
  const active = agentList.find(a => a.role === activeRole) || null;
  let connected = false;
  if (active) {
    let cfg = { requiresKey: true, apiKey: null };
    try { cfg = (typeof resolveBackendConfig === 'function') ? resolveBackendConfig() : cfg; } catch (_) {}
    connected = !cfg.requiresKey || !!cfg.apiKey;
    const model = sessionStorage.getItem(RWA.K_MODEL) || RWA.MODEL;
    const backend = sessionStorage.getItem(RWA.K_BACKEND) || 'openrouter';
    const bridgeKind = cfg.kind === 'bridge' || cfg.kind === 'bridge-session';
    const aff = (active.affinity && active.affinity.length) ? ' · for ' + active.affinity.join('/') : '';
    const desc = active.description ? '<div>' + escRuntimeHtml(active.description) + '</div>' : '';
    // Bridge ignores the shared model field; only a pinned Bridge Model is
    // real there — name it when set, else name just the transport.
    const bridgeModel = (sessionStorage.getItem(RWA.K_BRIDGE_MODEL) || '').trim();
    const status = !connected ? 'not connected'
      : bridgeKind ? escRuntimeHtml('using ' + (backend === 'bridge' && bridgeModel ? bridgeModel + ' via ' : '') + backend)
      : escRuntimeHtml('using ' + model + ' via ' + backend);
    const btns = (connected ? '' : '<button type="button" data-ai-connect="1">Connect</button>')
      + '<button type="button" data-agent-off="1">Deactivate</button>';
    rows.push('<div class="rwa-mode-row"><div><div class="rwa-mode-title">' + escRuntimeHtml(active.role) + '</div>' + desc
      + '<div class="rwa-mode-meta">' + escRuntimeHtml('AI · ' + (active.verified ? 'verified' : 'unverified') + ' · primary' + aff) + '</div>'
      + '<div class="rwa-mode-meta">' + status + '</div></div>' + btns + '</div>');
  }
  for (const a of agentList) {
    if (active && a.role === active.role) continue;
    const isAdvisor = advisorSet.indexOf(a.role) >= 0;
    const aff = (a.affinity && a.affinity.length) ? ' · for ' + a.affinity.join('/') : '';
    const meta = 'AI · ' + (a.verified ? 'verified' : 'unverified') + (isAdvisor ? ' · advisor' : '') + aff;
    let btns = '';
    if (a.verified) {
      const r = escRuntimeHtml(a.role);
      if (isAdvisor) btns = '<button type="button" data-agent-advoff="' + r + '">Remove advisor</button>';
      else btns = '<button type="button" data-agent-on="' + r + '">Activate</button>'
        + (advisorFull ? '<button type="button" disabled title="advisor limit reached">Add as advisor AI</button>' : '<button type="button" data-agent-advon="' + r + '">Add as advisor AI</button>');
    }
    const desc = a.description ? '<div>' + escRuntimeHtml(a.description) + '</div>' : '';
    rows.push('<div class="rwa-mode-row"><div><div class="rwa-mode-title">' + escRuntimeHtml(a.role) + '</div>' + desc + '<div class="rwa-mode-meta">' + escRuntimeHtml(meta) + '</div></div>' + btns + '</div>');
  }
  // Advisory-only edit input — only under an ACTIVE AI (the target of the edit). Personality is
  // signed+frozen; this can only change model/backend (spec §3). Wired below.
  const editBlock = active
    ? '<div class="rwa-ai-edit"><div class="rwa-ai-edit-kicker">Tune this AI · advisory only</div><input type="text" data-ai-edit aria-label="Edit this AI" placeholder="Change its model — e.g. “use gemini”"><button type="button" data-ai-edit-run>Apply</button><div class="rwa-ai-edit-result" data-ai-edit-result></div></div>'
    : '';
  panel.innerHTML = [
    '<div class="rwa-mode-section"><div class="rwa-mode-kicker">AI</div>' + (rows.length ? rows.join('') : '<div class="rwa-mode-empty">No AI installed yet.</div>') + editBlock + '</div>',
    '<div class="rwa-mode-section"><p>Drop an AI file anywhere on this page — or browse the <a href="https://rewritable.ikangai.com/ai" target="_blank" rel="noopener">AI Gallery</a>.</p>',
    '<div class="rwa-mode-actions"><button type="button" id="rwa-ai-manual">set up manually (⚙)</button></div></div>',
  ].join('');
  const openSettings = () => {
    panel.classList.remove('open');
    const setP = document.getElementById('rwa-set-panel'); if (setP) setP.classList.add('open');
    const key = document.getElementById('rwa-key'); if (key) key.focus();
  };
  const manualBtn = panel.querySelector('#rwa-ai-manual');
  if (manualBtn) manualBtn.addEventListener('click', openSettings);
  const connectBtn = panel.querySelector('[data-ai-connect]');
  if (connectBtn) connectBtn.addEventListener('click', openSettings); // v1: Connect = the ⚙ form (the slim connect card is the invite's job)
  panel.querySelectorAll('[data-agent-on]').forEach(btn => btn.addEventListener('click', () => {
    const role = btn.getAttribute('data-agent-on');
    try { runtimeActivateAgent(role); const aw = affinityWarning(role); if (aw && typeof setStatus === 'function') setStatus('', aw); } // setActive + offer model; advisory affinity warn (I-D)
    catch (e) { if (typeof setStatus === 'function') setStatus('err', '✗ ' + (e && (e.code || e.message))); }
    renderAiChip(); renderAiPanel(panel);
    // Connect check — activation flips the chip, but a session with no reachable model still can't run
    // ⌘K (key/model are sessionStorage-only). If so, drop this panel and raise the AI-aware drop
    // invitation naming the role we just activated. Read the CURRENT session synchronously — a pending
    // recommended-model consent that switches to a keyless backend is handled by the next ⌘K's own guard.
    let canRun = true;
    try { const cfg = (typeof resolveBackendConfig === 'function') ? resolveBackendConfig() : { requiresKey: false }; canRun = !cfg.requiresKey || !!cfg.apiKey; } catch (_) {}
    // Defer to an open recommended-model offer (mounted synchronously inside offerRecommendedModel just
    // above) — don't stack a second modal, and the offer may switch to a keyless backend (invite would be
    // a false alarm). If the session still can't run once the offer is dismissed, the next ⌘K's own guard raises the invite.
    if (!canRun && !document.getElementById('rwa-model-offer') && typeof showAiInvite === 'function') { panel.classList.remove('open'); showAiInvite(); }
  }));
  const agentOff = panel.querySelector('[data-agent-off]');
  if (agentOff) agentOff.addEventListener('click', () => { runtimeSetActiveAgent(null); renderAiChip(); renderAiPanel(panel); });
  panel.querySelectorAll('[data-agent-advon]').forEach(btn => btn.addEventListener('click', () => {
    const role = btn.getAttribute('data-agent-advon');
    try { runtimeAddAdvisor(role); const aw = affinityWarning(role); if (aw && typeof setStatus === 'function') setStatus('', aw); } // I-E: layer an advisory lens; I-D affinity warn
    catch (e) { if (typeof setStatus === 'function') setStatus('err', '✗ ' + (e && (e.code || e.message))); }
    renderAiChip(); renderAiPanel(panel);
  }));
  panel.querySelectorAll('[data-agent-advoff]').forEach(btn => btn.addEventListener('click', () => { runtimeRemoveAdvisor(btn.getAttribute('data-agent-advoff')); renderAiChip(); renderAiPanel(panel); }));
  // Advisory-only edit: applyChipEdit either applies model/backend (session) or declines a signed
  // edit and points at the Maker. It can NEVER write a signed field (see classifyChipEdit).
  const editInput = panel.querySelector('[data-ai-edit]');
  const editRun = panel.querySelector('[data-ai-edit-run]');
  if (editInput || editRun) {
    const LABEL = { system_prompt: 'instructions', role: 'name', description: 'description', vault: 'credential reach' };
    const runChipEditUi = () => {
      const val = ((editInput && editInput.value) || '').trim();
      if (!val) return;
      const r = (typeof applyChipEdit === 'function') ? applyChipEdit(val) : { action: 'decline', reason: 'unrecognized', redirect: 'maker' };
      if (r.action === 'apply') {
        renderAiChip(); renderAiPanel(panel); // re-render so the status line reflects the new model/backend
        const res = panel.querySelector('[data-ai-edit-result]');
        if (res) { res.textContent = r.field === 'model' ? ('✓ now using ' + r.value + ' · this session') : ('✓ backend → ' + r.value + ' · this session'); res.className = 'rwa-ai-edit-result ok'; }
        return;
      }
      const res = panel.querySelector('[data-ai-edit-result]');
      if (!res) return;
      const who = (active && active.role) || 'This AI'; // raw — escaped once with the lead below
      const lab = LABEL[r.field] || 'personality';
      // Appositive phrasing ("<field> — signed …") avoids is/are disagreement across singular
      // (name/description) and plural (instructions) labels; casing differs per lead.
      const lead = r.reason === 'signed'
        ? '🔒 ' + who + '’s ' + lab + ' — signed by its author, kept as written. Make your own copy in'
        : 'I can change its model or backend (e.g. “use gemini”). To change how it writes, fork your own copy in';
      res.innerHTML = escRuntimeHtml(lead) + ' <a href="https://rewritable.ikangai.com/ai/maker" target="_blank" rel="noopener">the AI Maker</a> →';
      res.className = 'rwa-ai-edit-result decline';
    };
    if (editRun) editRun.addEventListener('click', runChipEditUi);
    if (editInput) editInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); runChipEditUi(); } });
  }
}

// ─── Agent (rwa-edit/1) ─────────────────────────────────────────────
// Spec: rwa-edit-spec.md (v1.4). The agent edits the doc via tool calls,
// not by emitting a full rewritten document. unchanged regions are byte-
// identical because the model never re-emits them.

// === PRODUCT: SYSTEM_PROMPT registry === (selects from PRODUCT_KIND above)
// Audit R1 lands here: the agent prompt is a registry keyed by product kind,
// not a single hardcoded constant. Shared rules (tools, DSL syntax, frozen
// zones, data-rwa-id) live in SYSTEM_PROMPT_RULES; per-kind framing wraps
// them with kind-specific opening text and (where useful) structural
// guidance. SYSTEM_PROMPT resolves at module load time via PRODUCT_KIND.
// rwa:extract:begin SYSTEM_PROMPT_RULES
const SYSTEM_PROMPT_RULES = `
You have three tools:
  • apply_dsl_plan — preferred for STRUCTURAL transforms. Submit a sequence of typed ops (replace, insert, delete, set_attr) compiled deterministically to anchored edits. The runtime guarantees bytes outside change regions stay byte-identical. Use for: insert/delete elements, mass rename, wrap/unwrap, change a class or attribute, reorder.
  • apply_edits — preferred for CONTENT transforms. Submit (find, replace) pairs. Each find must be a non-empty literal substring that appears exactly once in the doc. Use for: prose rewrites, value updates, fine-grained text changes, translations, typo fixes.
  • replace_document — escape hatch. Use only for scaffolding a fresh document, or when the user explicitly asked for a wholesale redesign.

Preference: structural change → apply_dsl_plan. Content change → apply_edits. Wholesale redesign → replace_document. The two surgical tools cover different kinds of work; pick the one that fits the change.

Rules for apply_dsl_plan:
  • version is "rwa-edit-dsl/1". ops is a non-empty array.
  • Each op MUST be a flat JSON object with an "op" field naming the op type, plus its op-specific fields. The exact shapes:
      {"op":"replace","find":"...","replace":"..."}                    (optional: "region":"...","all":true)
      {"op":"insert","content":"...","after":"..."}    OR    {"op":"insert","content":"...","before":"..."}
      {"op":"delete","target":"..."}
      {"op":"set_attr","anchor":"<tag ...","attr":"...","value":"..."}
      {"op":"replace_document","doc":"...","reason":"..."}              (must be the sole op in the plan)
  • Do NOT nest the op type as a JSON key. {"delete":{"target":"..."}} is WRONG; the correct shape is {"op":"delete","target":"..."}.
  • Anchors and find/target/anchor strings must be uniquely locatable in the doc (extend with surrounding context if not).
  • set_attr.anchor MUST start with < and end BEFORE the closing > of the target element's opening tag (e.g. \`<p class="callout"\` — no trailing >). The compiler reads up to the next > to determine the full opening tag.
  • For repeated patterns (e.g. wrap each card in a section), emit one op per match with disambiguating context, OR use replace with all=true.
  • Frozen zones are off-limits — see below.

Rules for apply_edits:
  • Copy anchors from the doc verbatim. Do not retype them.
  • Whitespace and line endings in find must match the doc exactly.
  • If your natural anchor is not unique, extend it with surrounding context until it is.
  • Never include the substrings rwa:frozen:begin, rwa:frozen:end, the HTML/CSS/JS comment prefixes that start with rwa: (HTML <!--, CSS /*, JS //), or the attribute name data-rwa-frozen in find or replace. Frozen zones are listed in the user message and are off-limits.
  • Do not add or remove <script> or <style> tags via apply_edits — that requires replace_document.
  • If your edit's anchor would be longer than the changed region itself, replace_document is probably more appropriate.

Rules for replace_document:
  • Frozen-zone marker pairs and data-rwa-frozen elements must appear in the new doc with byte-identical content. They are author-declared invariants.
  • If the doc carries class-declared locked regions (.rwa-locked) that are NOT entirely covered by marker-form frozen zones, replace_document will be rejected. In that case, prefer apply_edits or apply_dsl_plan. The user message lists any such regions.
  • Provide a reason explaining why a smaller tool was not appropriate.

If the user's input is itself substantial content (a long block of prose, an outline, a list of items), they want it rendered into the document, not summarized. When no surgical anchor exists for substantial content insertion, use replace_document.

Stable block identifiers (data-rwa-id):
  • Many block-level elements in the doc (p, h1–h6, blockquote, li, figure, pre, aside) carry a \`data-rwa-id="…"\` attribute the runtime assigns. The value is opaque (8 lower-base32 chars).
  • Preserve these attributes verbatim when editing. If you replace the surrounding text of a block, copy the existing data-rwa-id into your replace string. They are the stable name of that block; URLs link to them.
  • Never invent new data-rwa-id values. The runtime backfills any block you produce without one. Inventing duplicates would break fragment links to existing blocks.

Embedded images (rwa-asset tokens):
  • Image src values appear as opaque \`rwa-asset:<id>\` tokens — stable identifiers for images embedded in the file. Move, copy, or delete the whole <img>/<figure> tag freely (quote the token verbatim in find/replace), but never edit a token, invent a new one, or replace one with a URL. An unknown token is rejected as unknown_asset_reference.

Print & pagination (the document prints through the browser; the runtime honors these on paper):
  • class="print-break" on a block starts a new printed page before it. class="print-keep" keeps a block together on one page. class="no-print" hides a block on paper. class="print-only" shows a block only on paper (hidden on screen).
  • Give data tables a <thead> around the header row — the browser then repeats it on every printed page.
  • The runtime already prevents stranded headings and widowed lines. Per-page running headers/footers and page numbers come from the browser's print dialog (Headers and Footers option), not from document markup — never simulate them with position:fixed; that prints broken.

Always call a tool. Respond with text-only only when you genuinely need to ask for clarification before editing.`;
// rwa:extract:end SYSTEM_PROMPT_RULES

// ─── Validator (rwa-edit/1) ─────────────────────────────────────────
class RwaEditError extends Error {
  constructor(code, editIndex = null, context = {}) {
    super(code);
    this.code = code;
    this.editIndex = editIndex;
    this.context = context;
  }
}

const RWA_EDIT = {
  MAX_REPLACE: 8 * 1024,                 // per-edit replace cap (spec §13 rule 5)
  MAX_DOC: 1024 * 1024,                  // whole-doc cap
  RETRIES: 3,                            // §9.2
  RESERVED: ['rwa:frozen:begin', 'rwa:frozen:end', '<' + '!-- rwa:', '/*' + ' rwa:', '//' + ' rwa:', 'data-rwa-frozen'],
};

function containsReservedMarker(s) {
  if (!s) return false;
  for (const m of RWA_EDIT.RESERVED) if (s.includes(m)) return true;
  return false;
}

// ─── Image-asset virtualization (images-v1) ─────────────────────────
// The agent never sees image bytes: data:image URIs are swapped for compact
// rwa-asset:<hash8> tokens at every agent boundary (modify / bridge /
// anchored command), and expanded back in the apply core after validation —
// so MAX_DOC/MAX_REPLACE measure the TEXT budget, never pixels. FNV-1a, not
// crypto: tokens are identity/dedupe within one doc, not integrity. Hash-keyed
// (not ordinal) so the agent can move/duplicate/delete tags freely.
function rwaAssetHash8(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}
const RWA_ASSET_SRC_RE = /(\bsrc\s*=\s*)(["'])(data:image\/[^"']*)\2/g;
const RWA_ASSET_TOKEN_RE = /(\bsrc\s*=\s*)(["'])(rwa-asset:[0-9a-f]{8,})\2/g;
function registerImageAsset(assets, uri) {
  // Collision probe: deterministic re-salt, so two distinct URIs hashing equal
  // (32-bit birthday, ~1e-6 at 100 images) still get distinct tokens.
  let n = 1, token;
  do { token = 'rwa-asset:' + rwaAssetHash8(n === 1 ? uri : uri + '\0' + n); n++; }
  while (assets.has(token) && assets.get(token) !== uri);
  assets.set(token, uri);
  return token;
}
function virtualizeImages(doc, assets) {
  assets = assets || new Map();
  // Orphans: rwa-asset tokens already present in the RAW doc (user-authored or
  // pre-broken). They map to nothing; expansion passes them through instead of
  // throwing, so a pre-broken doc stays editable.
  const orphans = new Set();
  let m;
  RWA_ASSET_TOKEN_RE.lastIndex = 0;
  while ((m = RWA_ASSET_TOKEN_RE.exec(doc)) !== null) orphans.add(m[3]);
  const vdoc = doc.replace(RWA_ASSET_SRC_RE, (_, p, q, uri) => p + q + registerImageAsset(assets, uri) + q);
  return { doc: vdoc, assets, orphans };
}
// Apply the URI→token substitution to ANY string (prompt slices, anchored
// finds, compose commitBase). Plain split/join — URIs are long, quote-free,
// and regex-hostile, so substring replacement is the safe primitive. A slice
// of the real doc virtualizes to the corresponding slice of the virtual doc
// as long as it doesn't cut a URI in half (block slices never do).
function virtualizeWithMap(s, assets) {
  if (!s || !assets || assets.size === 0) return s;
  let out = s;
  for (const [token, uri] of assets) out = out.split(uri).join(token);
  return out;
}
function expandImages(vdoc, assets, orphans) {
  return vdoc.replace(RWA_ASSET_TOKEN_RE, (whole, p, q, token) => {
    const uri = assets ? assets.get(token) : null;
    if (uri == null) {
      if (orphans && orphans.has(token)) return whole;
      throw new RwaEditError('unknown_asset_reference', null, { token });
    }
    return p + q + uri + q;
  });
}
// No-assets writers must not introduce a NEW rwa-asset token — a token with
// no bytes behind it is a permanently broken image, and committing one
// silently is exactly the failure mode Rule 12 forbids. Tokens already in
// the current doc stay legal (editing a pre-broken doc must not be bricked).
function assertNoNewAssetTokens(currentDoc, work) {
  const seen = new Set();
  let m;
  RWA_ASSET_TOKEN_RE.lastIndex = 0;
  while ((m = RWA_ASSET_TOKEN_RE.exec(currentDoc)) !== null) seen.add(m[3]);
  RWA_ASSET_TOKEN_RE.lastIndex = 0;
  while ((m = RWA_ASSET_TOKEN_RE.exec(work)) !== null) {

// Resolve the user-selected backend into a transport config.
// kind:'openai_compat' covers openrouter/ollama/lmstudio — same wire protocol,

  const backend = sessionStorage.getItem(RWA.K_BACKEND) || 'openrouter';

    return {
      backend, kind:'openai_compat',

      apiKey: null, extraHeaders: {}, requiresKey: false,

  }
  if (backend === 'lmstudio') {
    return {
      backend, kind:'openai_compat',
      baseUrl: (sessionStorage.getItem(RWA.K_BASE_URL_LMSTUDIO) || '').trim() || RWA.DEFAULT_LMSTUDIO_URL,
      apiKey: null, extraHeaders: {}, requiresKey: false,
    };
  }
  if (backend === 'atomic') {
    return {
      backend, kind:'openai_compat',
      baseUrl: (sessionStorage.getItem(RWA.K_BASE_URL_ATOMIC) || '').trim() || RWA.DEFAULT_ATOMIC_URL,
      apiKey: null, extraHeaders: {}, requiresKey: false,

      maxTokens: 8192,

    return { backend, kind:'bridge-session' };

    apiKey: sessionStorage.getItem(RWA.K_API),

    const e = await r.json().catch(() => ({}));
    throw new Error((e.error && e.error.message) || r.statusText || ('http ' + r.status));
  }

// GET <baseUrl>/models — used by the settings panel to populate the model
// suggestions for Ollama/LMStudio. Returns an array of model id strings.
async function listOpenAiCompatModels(cfg) {
  const headers = { ...(cfg.extraHeaders || {}) };
  if (cfg.apiKey) headers['Authorization'] = 'Bearer ' + cfg.apiKey;
  const url = cfg.baseUrl.replace(/\/+$/, '') + '/models';
  const r = await fetch(url, { method:'GET', headers });
  if (!r.ok) throw new Error('http ' + r.status);

  const items = Array.isArray(data?.data) ? data.data : (Array.isArray(data?.models) ? data.models : []);

// rwa-lens/1: single-shot completion helper for anchored slash commands.
// Unlike modify(), no tool_use loop: the runtime constructs the envelope from
// the model's plain-text response (one block of HTML), so we don't need tools
// at all — just a plain chat completion. tool_choice: 'none' is implicit by
// omitting tools.
async function callAgentSingleShot(prompt) {
  const cfg = resolveBackendConfig();
  if (cfg.kind === 'bridge' || cfg.kind === 'bridge-session') return callBridgeSingleShot(prompt);
  if (cfg.requiresKey && !cfg.apiKey) throw new Error('no API key');
  const model = sessionStorage.getItem(RWA.K_MODEL) || RWA.MODEL;
  const data = await openAiCompatChat(cfg, {
    model,
    max_tokens: cfg.maxTokens || 32000,
    messages: [{ role:'user', content: prompt }],
  });
  const msg = data.choices?.[0]?.message;
  return (msg?.content || '').trim();
}

// Single source of truth for the bridge shell command. Both bridge entry points
// (callBridgeSingleShot + modifyViaBridge) route through here so the security
// posture is defined once.
//
// SECURITY (audit 2026-05-27): the prompt embeds the whole current document,
// which is attacker-controlled when the container was shared/received. We do NOT
// pass --permission-mode bypassPermissions: the bridge agent only has to EMIT
// TEXT (an rwa-edit envelope / naked HTML) and needs no tools, so bypassing
// permissions bought nothing but an RCE — prompt-injection text in the document
// could have run arbitrary shell via the localhost bridge. Default permission
// mode denies unattended tool use in headless `-p`, leaving the text path intact.
// (Residual: a user who has globally allowlisted Bash in their own claude config
// is still exposed in default mode — defense-in-depth tool restriction belongs in
// web_cli_bridge, which actually executes this command.) The prompt is base64-
// encoded so the document's quotes/backticks/$/newlines can't break out of the
// single-quoted echo (the b64 alphabet is shell-safe inside single quotes).
function bridgeCommand(prompt) {
  const promptB64 = btoa(unescape(encodeURIComponent(prompt)));
  // Optional model pin (Settings → Bridge Model). Unpinned, `claude -p` rides
  // the CLI's default model, which drifts with CLI updates and can change edit
  // behavior under the user silently. Charset-gated because the value is
  // spliced into the shell command the bridge executes; an invalid value
  // throws (surfacing in the modify failure) instead of silently unpinning.
  const model = (sessionStorage.getItem(RWA.K_BRIDGE_MODEL) || '').trim();
  if (model && !/^[A-Za-z0-9._:@-]+$/.test(model)) {
    throw new Error('bridge model ' + JSON.stringify(model) + ' — letters/digits/._:@- only (Settings → Bridge Model)');
  }
  return `echo '${promptB64}' | base64 -d | claude -p${model ? ` --model ${model}` : ''} --output-format text`;
}
// Test seam — jsdom only. bridgeCommand builds the shell string the localhost
// bridge executes; it shipped unconditionally, so a received document's own
// script could read it (docs/received-container-threat-model-2026-08-04.md §5).
if (typeof navigator !== 'undefined' && /jsdom/i.test(navigator.userAgent)) {
  window.bridgeCommand = bridgeCommand;
}

// Bridge counterpart to callAgentSingleShot. Anchored commands ask for naked
// HTML, not a JSON envelope, so we don't run parseBridgeEnvelope — but we do
// strip a leading ```html / ``` fence in case claude wraps it anyway.
async function callBridgeSingleShot(prompt) {
  const cmd = bridgeCommand(prompt);
  // Send the bridge token if one is configured. The bridge-session backend
  // requires a token (anchored slash commands route here for naked-HTML output);
  // the tokenless `bridge` backend leaves it unset, so this is a no-op there.
  const headers = { 'Content-Type': 'application/json' };
  const tok = (sessionStorage.getItem(RWA.K_BRIDGE_TOKEN) || '').trim();
  if (tok) headers['Authorization'] = 'Bearer ' + tok;
  let resp;
  try {
    resp = await fetch(RWA.BRIDGE_URL, {
      method: 'POST',
      headers,
      body: JSON.stringify({ command: cmd }),
    });
  } catch (err) {
    throw new Error('bridge unreachable at ' + RWA.BRIDGE_URL + ' — is web_cli_bridge running?');
  }
  if (!resp.ok) throw new Error('bridge http ' + resp.status);
  const { stdout, stderr, exit_code } = await resp.json();
  if (exit_code !== 0) {
    const tail = (stderr || '').trim().split('\n').slice(-3).join('\n').slice(0, 300);
    throw new Error('claude -p exited ' + exit_code + (tail ? ': ' + tail : ''));
  }
  return (stdout || '').trim()
    .replace(/^```(?:html)?\s*\n?/i, '')
    .replace(/\n?\s*```\s*$/, '')
    .trim();
}

// rwa-lens/1: post-commit anchor behavior (spec §5.4).
// Three branches based on the agent's response shape:
//   1. Single anchorable block → re-anchor on the new block at the same source-start.
//   2. Multiple anchorable blocks → release with affordance (the lens can no longer
//      point at "this block" because the response replaced it with several).
//   3. Empty (or no anchorable elements after parse) → release without affordance
//      (the user explicitly asked for deletion, no surprise to surface).
function handlePostCommitAnchor(response, prevAnchor) {
  const parsed = new DOMParser().parseFromString(`<body>${response}</body>`, 'text/html');
  const tops = Array.from(parsed.body.children).filter(el => ANCHORABLE_TAGS.has(el.tagName));
  if (tops.length === 0) {
    // Empty (or no anchorable elements) → release without affordance.
    releaseAnchor();
    return;
  }
  if (tops.length === 1) {
    // Single anchorable block → re-anchor on the new entry at the prevAnchor.start position.
    const newEntry = sourceMap ? sourceMap.find(m => m.start === prevAnchor.start) : null;
    if (newEntry) anchorTo(newEntry);
    else releaseAnchor();
    return;
  }
  // Multi-block → release with affordance.
  releaseAnchor();
  showAffordance('anchor released — response was multi-block');
}

// rwa-lens/1: ephemeral toast for surfacing post-commit affordances.
// Used by handlePostCommitAnchor's multi-block branch to explain why the
// lens is no longer anchored. Auto-removes after 3 seconds.
function showAffordance(text) {
  const el = document.createElement('div');
  el.className = 'rwa-lens-toast';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// rwa-lens/1: anchored slash command runner (spec §7).
// Build the bounded context, prompt the agent for a replacement block, validate
// the response shape, synthesize an apply_edits envelope (anchored find +
// prefix/suffix from resolveAnchorFind), commit through applyEdits, and apply
// the spec §5.4 post-commit anchor behavior (re-anchor / release-with-affordance /
// release). Up to 3 retries with structured failure context appended to the
// prompt. No silent escalation to replace_document.
async function runAnchoredCommand(anchor, instruction) {
  // §5.10: the anchored-edit path is available ONLY when no render mode is
  // active — a whole-mount view rearranges the DOM, so re-anchoring against it
  // would resolve the wrong block. Suspending the click listener alone is
  // insufficient (a stale anchor can re-enter here). Inert for non-presentation:
  // activeView is permanently null, so this branch is never taken.
  if (activeView) { setStatus('err', '✗ anchored edits unavailable in this view'); return; }
  if (modifyMutex) {
    setStatus('err', '✗ another modify in progress');
    setLensProgress('error', 'another modify in progress');
    throw new RwaEditError('concurrent_modify');
  }
  modifyMutex = true;
  // Task 11.1: visible busy indicator on the lens during in-flight commands.
  const lensBusy = document.getElementById('rwa-lens');
  if (lensBusy) lensBusy.dataset.busy = 'true';
  setStatus('run', '⌘K running');
  setLensProgress('thinking', 'Thinking…');
  try {
    // images-v1: anchored prompts and finds are slices of the REAL doc
    // (currentDocCache), so virtualize the slices with one shared map and run
    // the apply on the matching virtual doc — the model sees tokens, the
    // commit expands them, and an invented token rejects instead of landing.
    const vimg = virtualizeImages(canonLF(await getDoc()));
    const { target, context } = buildAnchoredContextWindow(anchor);
    const basePrompt = buildAnchoredPrompt(
      virtualizeWithMap(target, vimg.assets),
      virtualizeWithMap(context, vimg.assets),
      instruction);
    let attempts = 0;
    let lastFailure = null;
    while (attempts < 3) {
      attempts++;
      setLensProgress('thinking',
        attempts === 1 ? 'Thinking…' : `Retrying (attempt ${attempts}/3)…`);
      const tryPrompt = basePrompt + (lastFailure ? `\n\nPrevious attempt failed: ${lastFailure}\nRetry honoring the constraint.` : '');
      const response = await callAgentSingleShot(tryPrompt);
      const validation = validateAnchoredResponse(response, anchor);
      if (!validation.ok) { lastFailure = validation.reason; continue; }
      const find = resolveAnchorFind(anchor);
      if (!find) { lastFailure = 'anchor could not be resolved (ambiguous source)'; continue; }
      const envelope = {
        version: 'rwa-edit/1',
        edits: [{
          find: virtualizeWithMap(find.find, vimg.assets),
          replace: virtualizeWithMap(find.replacePrefix, vimg.assets) + response + virtualizeWithMap(find.replaceSuffix, vimg.assets),
          reason: 'lens: anchored slash command',
        }],
        reason: `lens: ${instruction}`,
      };
      try {
        const lensMeta = {
          surface: 'anchored-command',
          instruction,
          scope: { type: 'block', block_id: String(anchor.start) },
          actor: getActiveActor(),   // audit R2
        };
        setLensProgress('thinking', 'Applying edits…');
        const result = await applyEdits(envelope, vimg.doc, lensMeta, { assets: vimg.assets, orphans: vimg.orphans });
        renderDoc(result);
        setDirty(true);
        await rwaBumpDirtyCount().catch(() => {});
        rwaCheckQuota();
        // Defer the emit so by the time listeners run, the `finally` block
        // below has released `modifyMutex`. Without this, a listener that
        // synchronously calls `runtime.modify()` from inside its callback
        // would hit `concurrent_modify` and have the error swallowed by
        // `emitRuntimeEvent`'s try/catch (Fix I2).
        queueMicrotask(() => {
          emitRuntimeEvent('modify', { instruction, lensMeta });
          emitRuntimeEvent('status', getStatusSnapshot());
        });
        // Spec §5.4 post-commit anchor branches: single → re-anchor on new
        // block; multi → release with affordance; empty → release silently.
        // The pre-commit anchor (with its start offset) is the stable handle
        // for the single-block re-anchor lookup, since find/replace splices
        // at the same source offset preserve the start position.
        handlePostCommitAnchor(response, anchor);
        setStatus('ok', '✓ done');
        setLensProgress('done', 'Done');
        return;
      } catch (err) {
        if (!(err instanceof RwaEditError)) throw err;
        lastFailure = err.code + (err.editIndex != null ? ' [edit ' + err.editIndex + ']' : '');
        continue;
      }
    }
    setStatus('err', `✗ ${lastFailure || 'lens command failed after retries'}`);
    setLensProgress('error', lastFailure || 'lens command failed after retries');
  } catch (e) {
    setStatus('err', '✗ ' + e.message);
    setLensProgress('error', e.message);
    console.error(e);
  } finally {
    modifyMutex = false;
    if (lensBusy) lensBusy.dataset.busy = 'false';
  }
}
